<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Hennessey Family Scheduler</title>
<style>
:root{
  --T:#1a73e8; --E:#d81b60; --S:#188038; --L:#e37400; --F:#7c3aed;
  --T-l:#e8f0fe; --E-l:#fce4ec; --S-l:#e6f4ea; --L-l:#fef3e0; --F-l:#f3e8fd;
  --bg:#fff; --surface:#f8f9fa; --border:#dadce0; --text:#3c4043; --muted:#70757a;
  --today:#1a73e8; --shadow:0 1px 3px rgba(60,64,67,.15), 0 4px 8px rgba(60,64,67,.1);
  --radius:8px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Google Sans',Roboto,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  color:var(--text); background:var(--bg); font-size:14px; overflow:hidden;
  display:flex; flex-direction:column;
}
button{font-family:inherit; cursor:pointer;}

/* ============ TOP BAR ============ */
.topbar{
  display:flex; align-items:center; gap:8px; padding:8px 16px;
  border-bottom:1px solid var(--border); background:var(--bg); flex-shrink:0; flex-wrap:nowrap;
}
.burger{background:none;border:none;border-radius:50%;width:40px;height:40px;font-size:20px;color:var(--muted);flex-shrink:0;}
.burger:hover{background:var(--surface);}
.logo{display:flex;align-items:center;gap:8px;margin-right:8px;white-space:nowrap;}
.logo .mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--T),var(--F));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;}
.logo .name{font-size:18px;color:var(--muted);font-weight:400;}
.logo .name b{color:var(--text);font-weight:500;}
.btn{
  border:1px solid var(--border); background:#fff; border-radius:6px; padding:8px 14px;
  font-size:14px; color:var(--text); white-space:nowrap;
}
.btn:hover{background:var(--surface);}
.btn.primary{background:var(--T);border-color:var(--T);color:#fff;font-weight:500;}
.btn.primary:hover{filter:brightness(1.08);}
.navarrows{display:flex;align-items:center;}
.navarrows button{background:none;border:none;border-radius:50%;width:36px;height:36px;font-size:18px;color:var(--muted);}
.navarrows button:hover{background:var(--surface);}
.rangelabel{font-size:19px;font-weight:400;color:var(--text);margin:0 8px;white-space:nowrap;min-width:150px;}
.spacer{flex:1;}
.search{
  display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:8px;padding:0 12px;height:38px;min-width:0;
}
.search input{border:none;background:none;outline:none;font-size:14px;width:170px;color:var(--text);}
.viewswitch{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;flex-shrink:0;}
.viewswitch button{border:none;background:#fff;padding:8px 13px;font-size:13px;color:var(--text);border-right:1px solid var(--border);}
.viewswitch button:last-child{border-right:none;}
.viewswitch button.active{background:var(--T-l);color:var(--T);font-weight:600;}
.viewswitch button:hover:not(.active){background:var(--surface);}

/* ============ LAYOUT ============ */
.main{display:flex;flex:1;min-height:0;}
.sidebar{
  width:256px;flex-shrink:0;border-right:1px solid var(--border);padding:14px;
  overflow-y:auto;background:#fff;transition:margin .2s;
}
.sidebar.hidden{margin-left:-257px;}
.content{flex:1;min-width:0;overflow:auto;background:#fff;display:flex;flex-direction:column;}

/* mini calendar */
.mini{margin-bottom:18px;}
.mini-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 8px;}
.mini-head .m-label{font-size:13px;font-weight:600;}
.mini-head button{background:none;border:none;color:var(--muted);font-size:14px;border-radius:50%;width:24px;height:24px;}
.mini-head button:hover{background:var(--surface);}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;}
.mini-grid .dn{font-size:10px;color:var(--muted);text-align:center;padding:3px 0;font-weight:600;}
.mini-grid .d{
  font-size:11px;text-align:center;padding:0;height:26px;line-height:26px;border-radius:50%;cursor:pointer;position:relative;
}
.mini-grid .d:hover{background:var(--surface);}
.mini-grid .d.other{color:#b8bcc1;}
.mini-grid .d.today{background:var(--T);color:#fff;font-weight:600;}
.mini-grid .d.sel:not(.today){background:var(--T-l);color:var(--T);font-weight:600;}
.mini-grid .d .dots{position:absolute;bottom:1px;left:0;right:0;display:flex;justify-content:center;gap:2px;}
.mini-grid .d .dots i{width:4px;height:4px;border-radius:50%;display:block;}

/* filter groups */
.fgroup{margin-bottom:16px;}
.fgroup h4{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:6px;font-weight:700;}
.frow{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:6px;cursor:pointer;user-select:none;}
.frow:hover{background:var(--surface);}
.frow .cb{width:16px;height:16px;border-radius:4px;border:2px solid var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;}
.frow.on .cb{border-color:transparent;}
.frow .lbl{font-size:13.5px;}
.frow .cnt{margin-left:auto;font-size:11px;color:var(--muted);}
.src-list a{display:block;font-size:12.5px;color:var(--T);text-decoration:none;padding:3px 4px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.src-list a:hover{background:var(--surface);text-decoration:underline;}

/* ============ MONTH VIEW ============ */
.month{display:flex;flex-direction:column;flex:1;min-height:0;}
.mon-daynames{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border);flex-shrink:0;}
.mon-daynames div{padding:6px;text-align:center;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;}
.mon-body{flex:1;display:grid;grid-auto-rows:1fr;min-height:0;}
.mon-week{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--border);min-height:0;overflow:hidden;}
.mon-cell{border-right:1px solid var(--border);padding:0;position:relative;overflow:hidden;cursor:pointer;}
.mon-cell:last-child{border-right:none;}
.mon-cell.other{background:#fafbfc;}
.mon-cell.other .daynum{color:#b8bcc1;}
.daynum{
  font-size:12px;margin:4px auto 2px;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;display:block;
}
.mon-cell:hover .daynum{background:var(--surface);}
.daynum.today{background:var(--T);color:#fff;font-weight:600;}
.mon-events{position:absolute;top:30px;left:0;right:0;bottom:0;}
.ev-chip{
  position:absolute;height:20px;line-height:20px;font-size:11.5px;border-radius:4px;padding:0 6px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;z-index:2;
}
.ev-chip:hover{filter:brightness(.94);box-shadow:var(--shadow);z-index:5;}
.ev-chip.timed{background:none !important;color:var(--text);display:flex;align-items:center;gap:4px;padding:0 4px;}
.ev-chip.timed:hover{background:var(--surface) !important;box-shadow:none;}
.ev-chip.timed .bullet{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.ev-chip.timed .t{color:var(--muted);font-size:10.5px;flex-shrink:0;}
.ev-chip.timed .n{overflow:hidden;text-overflow:ellipsis;}
.ev-more{
  position:absolute;height:18px;line-height:18px;font-size:11px;color:var(--muted);font-weight:600;
  padding:0 6px;cursor:pointer;border-radius:4px;z-index:2;
}
.ev-more:hover{background:var(--surface);color:var(--text);}

/* ============ WEEK / DAY VIEW ============ */
.tgrid{display:flex;flex-direction:column;flex:1;min-height:0;}
.tg-head{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:#fff;}
.tg-gutter{width:52px;flex-shrink:0;}
.tg-head .col{flex:1;text-align:center;padding:6px 0 4px;border-left:1px solid var(--border);min-width:0;}
.tg-head .dow{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600;letter-spacing:.6px;}
.tg-head .dnum{font-size:22px;width:40px;height:40px;line-height:40px;border-radius:50%;margin:2px auto;cursor:pointer;}
.tg-head .dnum:hover{background:var(--surface);}
.tg-head .dnum.today{background:var(--T);color:#fff;}
.tg-allday{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;max-height:120px;overflow-y:auto;}
.tg-allday .lbl{width:52px;flex-shrink:0;font-size:10px;color:var(--muted);text-align:right;padding:4px 6px 0 0;}
.tg-allday .lanes{flex:1;position:relative;}
.tg-allday .lanes .grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--cols,7),1fr);}
.tg-allday .lanes .grid i{border-left:1px solid var(--border);}
.tg-scroll{flex:1;overflow-y:auto;position:relative;}
.tg-canvas{display:flex;position:relative;}
.tg-times{width:52px;flex-shrink:0;position:relative;}
.tg-times div{position:absolute;right:8px;font-size:10px;color:var(--muted);transform:translateY(-50%);}
.tg-cols{flex:1;display:grid;grid-template-columns:repeat(var(--cols,7),1fr);position:relative;}
.tg-col{border-left:1px solid var(--border);position:relative;min-width:0;}
.tg-hline{position:absolute;left:0;right:0;border-top:1px solid #eceef1;pointer-events:none;}
.tg-ev{
  position:absolute;border-radius:5px;padding:3px 6px;font-size:11.5px;overflow:hidden;cursor:pointer;
  border:1px solid rgba(255,255,255,.7);line-height:1.25;
}
.tg-ev:hover{box-shadow:var(--shadow);z-index:20 !important;}
.tg-ev .tt{font-weight:600;}
.tg-ev .tm{font-size:10.5px;opacity:.85;}
.nowline{position:absolute;left:0;right:0;height:2px;background:#ea4335;z-index:15;pointer-events:none;}
.nowline::before{content:'';position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#ea4335;}

/* ============ YEAR VIEW ============ */
.year{padding:16px;overflow-y:auto;flex:1;}
.year-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;}
.ym{border:1px solid var(--border);border-radius:var(--radius);padding:10px;}
.ym h3{font-size:14px;font-weight:600;margin-bottom:6px;padding-left:4px;color:var(--text);cursor:pointer;}
.ym h3:hover{color:var(--T);}
.ym .mini-grid .d{height:24px;line-height:24px;cursor:pointer;}

/* ============ PLANNING VIEW ============ */
.plan{padding:20px 26px;overflow-y:auto;flex:1;max-width:1100px;}
.plan h2{font-size:20px;font-weight:500;margin:4px 0 14px;}
.plan .pmonth{margin-bottom:22px;}
.plan .pmonth>h3{
  font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);
  border-bottom:2px solid var(--border);padding-bottom:5px;margin-bottom:8px;
}
.prow{
  display:flex;gap:12px;align-items:flex-start;padding:8px 10px;border-radius:8px;cursor:pointer;
}
.prow:hover{background:var(--surface);}
.prow .date{width:92px;flex-shrink:0;font-size:12.5px;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums;}
.prow .pill{
  width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:5px;
}
.prow .body{min-width:0;}
.prow .body .t{font-size:14px;font-weight:500;}
.prow .body .sub{font-size:12.5px;color:var(--muted);margin-top:1px;}
.prow .tag{
  margin-left:auto;flex-shrink:0;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.5px;
}
.tag.open{background:#e6f4ea;color:#188038;}
.tag.closed{background:#fce8e6;color:#c5221f;}
.tag.notyet{background:#fef7e0;color:#b06000;}
.tag.reg{background:#fce8e6;color:#c5221f;}
.tag.potential{background:#f3e8fd;color:#7c3aed;}

/* ============ AGENDA (search results) ============ */
.agenda{padding:16px 24px;overflow-y:auto;flex:1;max-width:900px;}
.agenda .day-h{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 4px;text-transform:uppercase;letter-spacing:.8px;}

/* ============ EVENT POPOVER / MODALS ============ */
.overlay{position:fixed;inset:0;background:rgba(32,33,36,.45);z-index:90;display:none;}
.overlay.show{display:block;}
.modal{
  position:fixed;z-index:100;background:#fff;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.28);
  width:min(430px,94vw);max-height:86vh;overflow-y:auto;left:50%;top:50%;transform:translate(-50%,-50%);display:none;
}
.modal.show{display:block;}
.modal .mhead{display:flex;justify-content:flex-end;gap:4px;padding:8px 8px 0;}
.modal .mhead button{background:none;border:none;border-radius:50%;width:32px;height:32px;font-size:15px;color:var(--muted);}
.modal .mhead button:hover{background:var(--surface);}
.modal .mbody{padding:0 22px 22px;}
.ev-title{font-size:20px;font-weight:500;margin-bottom:4px;display:flex;align-items:flex-start;gap:10px;}
.ev-title .swatch{width:16px;height:16px;border-radius:5px;flex-shrink:0;margin-top:4px;}
.ev-meta{font-size:13.5px;color:var(--muted);margin:2px 0 0 26px;}
.ev-detail{display:flex;gap:10px;font-size:13.5px;margin-top:12px;align-items:flex-start;}
.ev-detail .ic{width:18px;flex-shrink:0;color:var(--muted);text-align:center;}
.ev-detail a{color:var(--T);text-decoration:none;word-break:break-all;}
.ev-detail a:hover{text-decoration:underline;}
.ev-notes{background:var(--surface);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:12px;line-height:1.45;}
.chip-person{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;color:#fff;}

/* form modal */
.fmodal label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 4px;}
.fmodal input[type=text],.fmodal input[type=date],.fmodal input[type=time],.fmodal input[type=url],.fmodal select,.fmodal textarea{
  width:100%;border:1px solid var(--border);border-radius:6px;padding:9px 10px;font-size:14px;font-family:inherit;background:#fff;color:var(--text);
}
.fmodal .row2{display:flex;gap:10px;}
.fmodal .row2>div{flex:1;}
.fmodal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
.fmodal .del{margin-right:auto;color:#c5221f;border-color:#f3c1bf;}
.check-inline{display:flex;align-items:center;gap:7px;font-size:13.5px;margin-top:12px;cursor:pointer;}

/* day-popup (from +N more) */
.daypop{width:min(320px,92vw);}
.daypop h3{font-size:15px;font-weight:600;margin-bottom:8px;}
.daypop .ev-chip{position:static;display:flex;margin-bottom:4px;height:22px;line-height:22px;}

/* toast */
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;
  padding:11px 20px;border-radius:8px;font-size:13.5px;z-index:200;box-shadow:var(--shadow);display:none;
}

/* ============ RESPONSIVE ============ */
@media(max-width:900px){
  .topbar{flex-wrap:wrap;row-gap:6px;padding:8px 10px;}
  .logo .name{display:none;}
  .rangelabel{font-size:15px;min-width:0;flex:1;}
  .spacer{display:none;}
  .search{flex:1;min-width:130px;height:34px;}
  .search input{width:100%;}
  .viewswitch{margin-left:auto;}
  .viewswitch button{padding:7px 9px;font-size:12px;}
  .mon-body{grid-auto-rows:minmax(96px,1fr);overflow-y:auto;}
  .btn{padding:7px 10px;font-size:13px;}
  .burger{width:34px;height:34px;}
  .sidebar{position:fixed;left:0;top:57px;bottom:0;z-index:80;box-shadow:var(--shadow);margin-left:-280px;}
  .sidebar.open{margin-left:0;}
  .tg-gutter,.tg-times,.tg-allday .lbl{width:40px;}
  .ev-chip{font-size:10.5px;}
  .prow .date{width:70px;}
}
</style>
</head>
<body>

<div class="topbar">
  <button class="burger" id="burger" title="Menu">☰</button>
  <div class="logo"><div class="mark">H</div><div class="name"><b>Hennessey</b> Scheduler</div></div>
  <button class="btn" id="todayBtn">Today</button>
  <div class="navarrows">
    <button id="prevBtn" title="Previous">‹</button>
    <button id="nextBtn" title="Next">›</button>
  </div>
  <div class="rangelabel" id="rangeLabel"></div>
  <div class="spacer"></div>
  <div class="search">🔍<input id="searchBox" placeholder="Search events" autocomplete="off"></div>
  <div class="viewswitch" id="viewSwitch">
    <button data-v="day">Day</button>
    <button data-v="week">Week</button>
    <button data-v="month" class="active">Month</button>
    <button data-v="year">Year</button>
    <button data-v="plan">Planning</button>
    <button data-v="track">Tracking</button>
  </div>
</div>

<div class="main">
  <div class="sidebar" id="sidebar">
    <button class="btn primary" id="addBtn" style="width:100%;padding:11px;margin-bottom:16px;border-radius:22px;font-size:14px;">＋ &nbsp;Add event</button>
    <div class="mini" id="miniCal"></div>
    <div class="fgroup" id="peopleFilters"><h4>People</h4></div>
    <div class="fgroup" id="typeFilters"><h4>Event types</h4></div>
    <div class="fgroup"><h4>Data sources</h4><div class="src-list" id="srcList"></div></div>
  </div>
  <div class="content" id="content"></div>
</div>

<div class="overlay" id="overlay"></div>

<!-- event detail modal -->
<div class="modal" id="evModal">
  <div class="mhead">
    <button id="evEdit" title="Edit">✏️</button>
    <button id="evHide" title="Remove from calendar">🗑</button>
    <button class="mclose" title="Close">✕</button>
  </div>
  <div class="mbody" id="evBody"></div>
</div>

<!-- add / edit modal -->
<div class="modal fmodal" id="formModal">
  <div class="mhead"><button class="mclose" title="Close">✕</button></div>
  <div class="mbody">
    <div class="ev-title" style="margin-bottom:2px;" id="formTitle">Add event</div>
    <label>Title</label><input type="text" id="fTitle" placeholder="e.g. Tommy — Dentist">
    <div class="row2">
      <div><label>Person</label>
        <select id="fPerson">
          <option value="T">Tommy</option><option value="E">Emily</option><option value="S">Sophie</option>
          <option value="L">Laura</option><option value="F" selected>Family</option>
        </select></div>
      <div><label>Type</label>
        <select id="fType">
          <option value="family" selected>Family</option><option value="personal">Personal</option>
          <option value="practice">Practice</option><option value="game">Game</option>
          <option value="tournament">Tournament</option><option value="academic">Academic</option>
          <option value="noschool">No school / Holiday</option>
        </select></div>
    </div>
    <div class="row2">
      <div><label>Start date</label><input type="date" id="fStart"></div>
      <div><label>End date</label><input type="date" id="fEnd"></div>
    </div>
    <label class="check-inline"><input type="checkbox" id="fAllDay" checked> All day</label>
    <div class="row2" id="timeRow" style="display:none;">
      <div><label>Start time</label><input type="time" id="fTimeStart" value="09:00"></div>
      <div><label>End time</label><input type="time" id="fTimeEnd" value="10:00"></div>
    </div>
    <label>Location</label><input type="text" id="fLoc" placeholder="Optional">
    <label>Link</label><input type="url" id="fLink" placeholder="Optional">
    <label>Notes</label><textarea id="fNotes" rows="2" placeholder="Optional"></textarea>
    <div class="actions">
      <button class="btn del" id="fDelete" style="display:none;">Delete</button>
      <button class="btn mclose">Cancel</button>
      <button class="btn primary" id="fSave">Save</button>
    </div>
  </div>
</div>

<!-- +N more popup -->
<div class="modal daypop" id="dayPop">
  <div class="mhead"><button class="mclose">✕</button></div>
  <div class="mbody" id="dayPopBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================================================================
   HENNESSEY FAMILY SCHEDULER — v2 (Google-Calendar-style)
   Data: family_cal.json + masselite_practices.json + site_data.json
   ================================================================ */

// ---------- constants ----------
const PEOPLE = {
  T:{name:'Tommy', color:'var(--T)', hex:'#1a73e8', light:'var(--T-l)'},
  E:{name:'Emily', color:'var(--E)', hex:'#d81b60', light:'var(--E-l)'},
  S:{name:'Sophie', color:'var(--S)', hex:'#188038', light:'var(--S-l)'},
  L:{name:'Laura', color:'var(--L)', hex:'#e37400', light:'var(--L-l)'},
  F:{name:'Family', color:'var(--F)', hex:'#7c3aed', light:'var(--F-l)'},
};
const TYPES = {
  game:{label:'Games', icon:'🏅'},
  practice:{label:'Practices', icon:'🏃'},
  tournament:{label:'Tournaments & showcases', icon:'🏆'},
  academic:{label:'School events', icon:'🎓'},
  noschool:{label:'No school / breaks', icon:'🏖'},
  family:{label:'Family & personal', icon:'🏠'},
  potential:{label:'Potential (tracking)', icon:'👀'},
  regcheck:{label:'Registration reminders', icon:'⏰'},
};
const USER_KEY='sked_user_events_v1', HIDDEN_KEY='sked_hidden_ids_v3', FILTER_KEY='sked_filters_v4', VIEW_KEY='sked_view_v1', NOTES_KEY='sked_notes_v1';

// ---------- state ----------
let events=[];            // normalized events
let userEvents=JSON.parse(localStorage.getItem(USER_KEY)||'[]');
let hiddenIds=new Set(JSON.parse(localStorage.getItem(HIDDEN_KEY)||'[]'));
let userNotes=JSON.parse(localStorage.getItem(NOTES_KEY)||'{}');
function saveNote(id,text){
  text=(text||'').trim();
  if(text) userNotes[id]=text; else delete userNotes[id];
  localStorage.setItem(NOTES_KEY,JSON.stringify(userNotes));
}
let filters=JSON.parse(localStorage.getItem(FILTER_KEY)||'null')||{
  people:{T:true,E:true,S:true,L:true,F:true},
  types:{game:true,practice:true,tournament:true,academic:true,noschool:true,family:true,potential:true,regcheck:true},
};
let view=localStorage.getItem(VIEW_KEY)||'month';
let cursor=new Date(); cursor.setHours(0,0,0,0);
let miniCursor=new Date(cursor);
let searchQ='';
let siteData={sources:[],tracking_items:[],all_kids_out:[],practice_times:[],static_events:[]};
let editingId=null;

// ---------- date helpers ----------
const DAY=86400000;
const fmtYMD=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function parseYMD(s){const [y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d);}
const TZ='America/New_York';
const _tzf=new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
function toEastern(d){ // absolute instant → Date carrying Eastern wall-clock time
  const p={}; for(const x of _tzf.formatToParts(d)) p[x.type]=x.value;
  return new Date(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute);
}
function parseWhen(s){ // ISO string → Date in Eastern wall time
  if(!s) return null;
  if(s.length<=10) return parseYMD(s);
  if(/[zZ]$|[+-]\d{2}:?\d{2}$/.test(s)) return toEastern(new Date(s));
  return new Date(s); // naive string, assume already Eastern wall time
}
const startOfDay=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x;};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const startOfWeek=d=>{const x=startOfDay(d);x.setDate(x.getDate()-x.getDay());return x;}; // Sunday
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_S=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const TODAY=startOfDay(new Date());
function fmtTime(d){
  let h=d.getHours(),m=d.getMinutes();const ap=h>=12?'pm':'am';h=h%12||12;
  return m?`${h}:${String(m).padStart(2,'0')}${ap}`:`${h}${ap}`;
}

// ---------- person + type classification ----------
function detectPerson(e){
  const k=(e.kid||'').toString().toLowerCase();
  if(k==='t'||k==='tommy') return 'T';
  if(k==='e'||k==='emily') return 'E';
  if(k==='s'||k==='sophie') return 'S';
  const t=e.title||'';
  if(/^(tommy|t\s*[—-])/i.test(t)) return 'T';
  if(/^(emily|e\s*[—-])/i.test(t)) return 'E';
  if(/^(sophie|s\s*[—-])/i.test(t)) return 'S';
  if(/^laura/i.test(t)) return 'L';
  if(/tenacre/i.test(t)) return 'S';
  if(/ncds|wpc/i.test(t)) return 'E';
  if(/roxbury latin|laxachusetts|\brl\b/i.test(t)) return 'T';
  return 'F';
}
function detectType(e){
  if(/reg check|registration (check|reminder)/i.test(e.title||'')) return 'regcheck';
  if(e.type){
    const t=e.type.toLowerCase();
    if(t in TYPES) return t;
    if(t==='showcase') return 'tournament';
  }
  const t=(e.title||'').toLowerCase();
  if(/reg check|reg\s*—|registration (check|reminder)/i.test(t)) return 'regcheck';
  if(/no school|no classes|break\b|vacation|holiday|closed/.test(t)) return 'noschool';
  if(/practice|skills|training|shooting|speed|attack\/defense|gymnastics|lesson|clinic session/.test(t)) return 'practice';
  if(/tournament|showcase|invitational|jamboree|classic|championship|states|regionals|nationals|cup\b|sixes|prospect (day|camp)|camp\b/.test(t)) return 'tournament';
  if(/game|vs\.?|match|scrimmage/.test(t)) return 'game';
  if(/school|conferences|assembly|concert|musical|graduation|back to school|curriculum|picture day|field trip|grandfriends|fair\b/.test(t)) return 'academic';
  return 'family';
}
function lookupPracticeTime(title){
  for(const p of siteData.practice_times){ if(new RegExp(p.match).test(title)) return p; }
  return null;
}

// ---------- normalization ----------
function normAll(famCal,masselite,site){
  const out=[];
  const push=o=>{ if(o.start && !isNaN(o.start)) out.push(o); };

  // 1) family_cal.json — Google-Calendar-shaped. All-day `end` is EXCLUSIVE.
  for(const e of famCal){
    const allDay=!!e.allDay || (e.start||'').length<=10;
    let start=parseWhen(e.start), end;
    if(allDay){
      end = e.end ? addDays(parseYMD(e.end), (e.end.length<=10 && e.end!==e.start) ? -1 : 0) : new Date(start);
      if(e.time_start){ // date + separate times
        start=parseYMD(e.start); const [h1,m1]=e.time_start.split(':'); start.setHours(+h1,+m1);
        end=parseYMD(e.start); const [h2,m2]=(e.time_end||e.time_start).split(':'); end.setHours(+h2,+m2);
        push(mk(e,start,end,false)); continue;
      }
      if(end<start) end=new Date(start);
      push(mk(e,start,end,true));
    } else {
      end=e.end?parseWhen(e.end):new Date(start.getTime()+3600000);
      push(mk(e,start,end,false));
    }
  }
  // 2) masselite_practices.json — {kid,title,start(date),time_start,time_end,location}
  for(const e of masselite){
    const s=parseYMD(e.start), en=parseYMD(e.start);
    if(e.time_start){const [h,m]=e.time_start.split(':');s.setHours(+h,+m);}
    if(e.time_end){const [h,m]=e.time_end.split(':');en.setHours(+h,+m);} else en.setTime(s.getTime()+5400000);
    push(mk({...e, id:'me-'+(e.kid||'')+'-'+e.start, type:'practice', source:'masselite'},s,en,false));
  }
  // 3) site_data static events — end INCLUSIVE; practice-time lookup for known titles
  for(let i=0;i<site.static_events.length;i++){
    const e=site.static_events[i];
    const pt=e.time?{start:e.time,end:e.endTime||e.time}:lookupPracticeTime(e.title);
    if(pt && !e.end){
      const s=parseYMD(e.start), en=parseYMD(e.start);
      const [h1,m1]=pt.start.split(':'), [h2,m2]=pt.end.split(':');
      s.setHours(+h1,+m1); en.setHours(+h2,+m2);
      push(mk({...e,id:e.id||'static-'+i},s,en,false));
    } else {
      push(mk({...e,id:e.id||'static-'+i}, parseYMD(e.start), e.end?parseYMD(e.end):parseYMD(e.start), true));
    }
  }
  // 4) tracking items → potential events when dates parseable
  for(let i=0;i<site.tracking_items.length;i++){
    const t=site.tracking_items[i];
    const d=parseTrackingDates(t);
    if(d) push({id:'track-'+i, title:(t.kid?t.kid+' — ':'')+t.name+' (potential)', person:t.kid==='T'?'T':t.kid==='E'?'E':t.kid==='S'?'S':'F',
      type:'potential', start:d[0], end:d[1], allDay:true, location:t.location||'', link:t.url||'',
      notes:`Ages ${t.ages||'—'} · Registration: ${t.registration||'?'} · ${t.dates||''}`, source:'tracking', reg:t.registration});
  }
  // 5) user events (localStorage)
  for(const e of userEvents){
    const allDay=e.allDay!==false;
    let s,en;
    if(allDay){s=parseYMD(e.start);en=e.end?parseYMD(e.end):new Date(s);}
    else{
      s=parseYMD(e.start);const [h1,m1]=(e.timeStart||'09:00').split(':');s.setHours(+h1,+m1);
      en=parseYMD(e.end||e.start);const [h2,m2]=(e.timeEnd||'10:00').split(':');en.setHours(+h2,+m2);
    }
    push({id:e.id, title:e.title, person:e.person||'F', type:e.type||'family', start:s, end:en, allDay,
      location:e.location||'', link:e.link||'', notes:e.notes||'', source:'user'});
  }
  return out;

  function mk(e,start,end,allDay){
    return {id:e.id||e.title+e.start, title:e.title, person:detectPerson(e), type:detectType(e),
      start, end, allDay, location:e.location||'', link:e.link||'', notes:e.notes||'', source:e.source||''};
  }
}
function parseTrackingDates(t){
  // "Jul 20–21, 2026" | "Oct 25, 2026" | "Jan 9–10, 2027" | "Jul 27–28, 2026" — else null
  const m=(t.dates||'').match(/^([A-Z][a-z]{2})[a-z]*\s+(\d{1,2})(?:\s*[–-]\s*(\d{1,2}))?,\s*(\d{4})$/);
  if(!m) return null;
  const mo=MONTHS_S.indexOf(m[1]); if(mo<0) return null;
  const s=new Date(+m[4],mo,+m[2]), e=new Date(+m[4],mo,+(m[3]||m[2]));
  return [s,e];
}

// ---------- filtering ----------
function visible(){
  return events.filter(e=>{
    if(hiddenIds.has(e.id)) return false;
    if(!filters.people[e.person]) return false;
    if(!filters.types[e.type]) return false;
    if(searchQ){
      const q=searchQ.toLowerCase();
      if(!((e.title||'').toLowerCase().includes(q)||(e.location||'').toLowerCase().includes(q)||(e.notes||'').toLowerCase().includes(q)||(userNotes[e.id]||'').toLowerCase().includes(q))) return false;
    }
    return true;
  });
}
function eventsOnDay(list,day){
  const d0=startOfDay(day).getTime(), d1=d0+DAY;
  return list.filter(e=>{
    const s=e.allDay?startOfDay(e.start).getTime():e.start.getTime();
    const en=e.allDay?startOfDay(e.end).getTime()+DAY:e.end.getTime();
    return s<d1 && en>d0;
  });
}
function evColor(e){return PEOPLE[e.person]?.hex||'#5f6368';}
function evBg(e){
  const c=evColor(e);
  if(e.type==='noschool') return '#f1f3f4';
  if(e.type==='potential') return '#fff';
  if(e.type==='practice') return c+'26'; // ~15% alpha
  return c;
}
function evFg(e){
  if(e.type==='noschool') return '#5f6368';
  if(e.type==='potential') return evColor(e);
  if(e.type==='practice') return shade(evColor(e));
  return '#fff';
}
function shade(hex){ // darker text version of color
  const n=parseInt(hex.slice(1),16);
  const r=(n>>16)*0.55|0, g=((n>>8)&255)*0.55|0, b=(n&255)*0.55|0;
  return `rgb(${r},${g},${b})`;
}
function chipStyle(e){
  let s=`background:${evBg(e)};color:${evFg(e)};`;
  if(e.type==='potential') s+=`border:1.5px dashed ${evColor(e)};`;
  if(e.type==='regcheck') s+=`background:#fce8e6;color:#c5221f;font-weight:600;`;
  return s;
}

// ---------- rendering ----------
const $=id=>document.getElementById(id);
const content=$('content');
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function render(){
  document.querySelectorAll('#viewSwitch button').forEach(b=>b.classList.toggle('active',b.dataset.v===view));
  localStorage.setItem(VIEW_KEY,view);
  if(searchQ){renderAgenda();return;}
  if(view==='month') renderMonth();
  else if(view==='week') renderTimeGrid(7);
  else if(view==='day') renderTimeGrid(1);
  else if(view==='year') renderYear();
  else if(view==='track') renderTracking();
  else renderPlan();
  renderMini();
}

// ----- MONTH -----
function renderMonth(){
  $('rangeLabel').textContent=`${MONTHS[cursor.getMonth()]} ${cursor.getFullYear()}`;
  const first=new Date(cursor.getFullYear(),cursor.getMonth(),1);
  const gridStart=startOfWeek(first);
  const list=visible();
  let html=`<div class="month"><div class="mon-daynames">${DOW.map(d=>`<div>${d}</div>`).join('')}</div><div class="mon-body">`;
  const weeks=[];
  for(let w=0;w<6;w++){
    const wkStart=addDays(gridStart,w*7);
    if(w===5 && wkStart.getMonth()!==cursor.getMonth() && addDays(wkStart,6).getMonth()!==cursor.getMonth()) break;
    weeks.push(wkStart);
  }
  const ROWH=22, TOP=30;
  for(const wkStart of weeks){
    const wkEnd=addDays(wkStart,7);
    // lay out spanning segments for this week
    const segs=[];
    for(const e of list){
      const s=e.allDay?startOfDay(e.start):startOfDay(e.start);
      const en=e.allDay?addDays(startOfDay(e.end),1):(e.end.getHours()||e.end.getMinutes()?addDays(startOfDay(e.end),1):startOfDay(e.end));
      const multiOrAllday=e.allDay||((en-s)>DAY);
      const from=Math.max(s.getTime(),wkStart.getTime()), to=Math.min((e.allDay?addDays(startOfDay(e.end),1):new Date(Math.max(e.end.getTime(),e.start.getTime()+1))).getTime(),wkEnd.getTime());
      if(from>=to) continue;
      const c0=Math.floor((from-wkStart.getTime())/DAY), c1=Math.ceil((to-wkStart.getTime())/DAY)-1;
      segs.push({e,c0,c1:Math.min(c1,6),multi:multiOrAllday,sort:(e.allDay?0:1)});
    }
    segs.sort((a,b)=>a.sort-b.sort||(b.c1-b.c0)-(a.c1-a.c0)||a.e.start-b.e.start);
    // assign lanes
    const lanes=[]; // lanes[i] = array of [c0,c1]
    const perDayCount=Array(7).fill(0);
    for(const sg of segs){
      let lane=0;
      while(true){
        if(!lanes[lane]) lanes[lane]=[];
        if(!lanes[lane].some(([a,b])=>!(sg.c1<a||sg.c0>b))) break;
        lane++;
      }
      lanes[lane].push([sg.c0,sg.c1]); sg.lane=lane;
      for(let c=sg.c0;c<=sg.c1;c++) perDayCount[c]++;
    }
    html+=`<div class="mon-week">`;
    for(let c=0;c<7;c++){
      const d=addDays(wkStart,c);
      const other=d.getMonth()!==cursor.getMonth();
      html+=`<div class="mon-cell${other?' other':''}" data-day="${fmtYMD(d)}">
        <span class="daynum${sameDay(d,TODAY)?' today':''}">${d.getDate()===1?MONTHS_S[d.getMonth()]+' ':''}${d.getDate()}</span></div>`;
    }
    // events layer
    html+=`<div class="mon-events">`;
    const maxLanes=Math.max(2,Math.floor((110-TOP)/ROWH)); // recomputed at runtime via CSS clamp; use 3
    const MAXL=3;
    const colW=100/7;
    const hiddenPerDay=Array(7).fill(0);
    for(const sg of segs){
      if(sg.lane>=MAXL){ for(let c=sg.c0;c<=sg.c1;c++) hiddenPerDay[c]++; continue; }
      const e=sg.e;
      const left=`calc(${sg.c0*colW}% + 3px)`, width=`calc(${(sg.c1-sg.c0+1)*colW}% - 7px)`;
      const top=sg.lane*ROWH;
      if(sg.multi){
        html+=`<div class="ev-chip" data-ev="${esc(String(e.id))}" style="left:${left};width:${width};top:${top}px;${chipStyle(e)}">${TYPES[e.type]?.icon?'':''}${esc(e.title)}</div>`;
      } else {
        html+=`<div class="ev-chip timed" data-ev="${esc(String(e.id))}" style="left:${left};width:${width};top:${top}px;">
          <span class="bullet" style="background:${evColor(e)}"></span><span class="t">${fmtTime(e.start)}</span><span class="n">${esc(e.title)}</span></div>`;
      }
    }
    for(let c=0;c<7;c++){
      if(hiddenPerDay[c]>0){
        html+=`<div class="ev-more" data-day="${fmtYMD(addDays(wkStart,c))}" style="left:calc(${c*colW}% + 3px);top:${MAXL*ROWH}px;">+${hiddenPerDay[c]} more</div>`;
      }
    }
    html+=`</div></div>`;
  }
  html+=`</div></div>`;
  content.innerHTML=html;
}

// ----- WEEK / DAY (time grid) -----
function renderTimeGrid(nDays){
  const start = nDays===7 ? startOfWeek(cursor) : startOfDay(cursor);
  const end=addDays(start,nDays);
  if(nDays===7){
    const e2=addDays(start,6);
    $('rangeLabel').textContent = start.getMonth()===e2.getMonth()
      ? `${MONTHS[start.getMonth()]} ${start.getFullYear()}`
      : `${MONTHS_S[start.getMonth()]} – ${MONTHS_S[e2.getMonth()]} ${e2.getFullYear()}`;
  } else {
    $('rangeLabel').textContent=`${MONTHS[start.getMonth()]} ${start.getDate()}, ${start.getFullYear()}`;
  }
  const list=visible();
  const HOUR=48, DSTART=6, DEND=23; // 6am–11pm visible, scroll for rest
  // split all-day/multi vs timed
  const days=[...Array(nDays)].map((_,i)=>addDays(start,i));
  const allday=[],timed=[];
  for(const e of list){
    const s=e.allDay?startOfDay(e.start):e.start;
    const en=e.allDay?addDays(startOfDay(e.end),1):e.end;
    if(s<end && en>start){ (e.allDay?allday:timed).push(e); }
  }
  // all-day lanes
  const asegs=[];
  for(const e of allday){
    const s=startOfDay(e.start), en=addDays(startOfDay(e.end),1);
    const c0=Math.max(0,Math.floor((s-start)/DAY)), c1=Math.min(nDays-1,Math.floor((en-start)/DAY-0.001));
    asegs.push({e,c0,c1});
  }
  asegs.sort((a,b)=>(b.c1-b.c0)-(a.c1-a.c0));
  const alanes=[];
  for(const sg of asegs){
    let l=0;
    while(true){ if(!alanes[l])alanes[l]=[]; if(!alanes[l].some(([a,b])=>!(sg.c1<a||sg.c0>b))) break; l++; }
    alanes[l].push([sg.c0,sg.c1]); sg.lane=l;
  }
  let html=`<div class="tgrid">
    <div class="tg-head"><div class="tg-gutter"></div>${days.map(d=>`
      <div class="col"><div class="dow">${DOW[d.getDay()]}</div>
      <div class="dnum${sameDay(d,TODAY)?' today':''}" data-goday="${fmtYMD(d)}">${d.getDate()}</div></div>`).join('')}
    </div>`;
  if(asegs.length){
    const h=Math.min(alanes.length,5)*24+6;
    html+=`<div class="tg-allday"><div class="lbl">all-day</div><div class="lanes" style="height:${h}px;--cols:${nDays}">
      <div class="grid">${days.map(()=>'<i></i>').join('')}</div>`;
    for(const sg of asegs){
      const colW=100/nDays;
      html+=`<div class="ev-chip" data-ev="${esc(String(sg.e.id))}" style="left:calc(${sg.c0*colW}% + 3px);width:calc(${(sg.c1-sg.c0+1)*colW}% - 7px);top:${3+sg.lane*24}px;${chipStyle(sg.e)}">${esc(sg.e.title)}</div>`;
    }
    html+=`</div></div>`;
  }
  // time grid
  const gridH=24*HOUR;
  html+=`<div class="tg-scroll" id="tgScroll"><div class="tg-canvas" style="height:${gridH}px;">
    <div class="tg-times">`;
  for(let h=1;h<24;h++){
    const lbl=h%12||12, ap=h<12?'am':'pm';
    html+=`<div style="top:${h*HOUR}px;">${lbl} ${ap}</div>`;
  }
  html+=`</div><div class="tg-cols" style="--cols:${nDays};">`;
  // hour lines
  let lines='';
  for(let h=1;h<24;h++) lines+=`<div class="tg-hline" style="top:${h*HOUR}px;"></div>`;
  for(let i=0;i<nDays;i++){
    const d=days[i];
    // collect timed events for this day, cluster overlaps
    const evs=timed.filter(e=>e.start<addDays(d,1)&&e.end>d)
      .map(e=>({e, s:Math.max(0,(Math.max(e.start,d)-d)/3600000), en:Math.min(24,(Math.min(e.end,addDays(d,1))-d)/3600000)}))
      .sort((a,b)=>a.s-b.s||b.en-a.en);
    // simple column layout for overlaps
    const cols=[];
    for(const ev of evs){
      let c=0;
      while(cols[c] && cols[c].some(o=>!(ev.en<=o.s||ev.s>=o.en))) c++;
      if(!cols[c]) cols[c]=[];
      cols[c].push(ev); ev.col=c;
    }
    for(const ev of evs){
      // width = share with any overlapping cluster
      const overl=evs.filter(o=>!(ev.en<=o.s||ev.s>=o.en));
      const ncol=Math.max(...overl.map(o=>o.col))+1;
      ev.ncol=ncol;
    }
    let colHtml='';
    for(const ev of evs){
      const e=ev.e;
      const top=ev.s*HOUR, h=Math.max(22,(ev.en-ev.s)*HOUR-2);
      const w=100/ev.ncol, l=ev.col*w;
      colHtml+=`<div class="tg-ev" data-ev="${esc(String(e.id))}" style="top:${top}px;height:${h}px;left:calc(${l}% + 2px);width:calc(${w}% - 5px);${chipStyle(e)};z-index:${5+ev.col};">
        <div class="tt">${esc(e.title)}</div><div class="tm">${fmtTime(e.start)} – ${fmtTime(e.end)}</div></div>`;
    }
    const isToday=sameDay(d,TODAY);
    let now='';
    if(isToday){
      const mins=new Date().getHours()*60+new Date().getMinutes();
      now=`<div class="nowline" style="top:${mins/60*HOUR}px;"></div>`;
    }
    html+=`<div class="tg-col">${lines}${colHtml}${now}</div>`;
  }
  html+=`</div></div></div></div>`;
  content.innerHTML=html;
  // scroll to 7am (or now)
  const sc=$('tgScroll');
  if(sc) sc.scrollTop = (days.some(d=>sameDay(d,TODAY)) ? Math.max(0,(new Date().getHours()-2)) : 7)*HOUR;
}

// ----- YEAR -----
function renderYear(){
  const y=cursor.getFullYear();
  $('rangeLabel').textContent=String(y);
  const list=visible();
  // index events per day
  const byDay={};
  for(const e of list){
    let d=startOfDay(e.start);
    const en=e.allDay?startOfDay(e.end):startOfDay(e.end);
    let guard=0;
    while(d<=en && guard++<400){
      if(d.getFullYear()===y){
        const k=fmtYMD(d);
        (byDay[k]=byDay[k]||new Set()).add(e.person);
      }
      d=addDays(d,1);
    }
  }
  let html=`<div class="year"><div class="year-grid">`;
  for(let m=0;m<12;m++){
    const first=new Date(y,m,1), gs=startOfWeek(first);
    html+=`<div class="ym"><h3 data-gomonth="${y}-${String(m+1).padStart(2,'0')}">${MONTHS[m]}</h3><div class="mini-grid">`;
    html+=DOW.map(d=>`<div class="dn">${d[0]}</div>`).join('');
    for(let i=0;i<42;i++){
      const d=addDays(gs,i);
      if(i>=35 && d.getMonth()!==m) break;
      const other=d.getMonth()!==m;
      const k=fmtYMD(d);
      const ppl=byDay[k];
      let dots='';
      if(!other && ppl){
        dots=`<span class="dots">${[...ppl].slice(0,3).map(p=>`<i style="background:${PEOPLE[p].hex}"></i>`).join('')}</span>`;
      }
      html+=`<div class="d${other?' other':''}${sameDay(d,TODAY)?' today':''}" data-goday="${k}">${d.getDate()}${dots}</div>`;
    }
    html+=`</div></div>`;
  }
  html+=`</div></div>`;
  content.innerHTML=html;
}

// ----- PLANNING -----
function renderPlan(){
  $('rangeLabel').textContent='Planning';
  const list=visible().filter(e=>['tournament','regcheck','potential','noschool'].includes(e.type)||((e.end-e.start)>=2*DAY&&e.allDay));
  list.sort((a,b)=>a.start-b.start);
  const from=addDays(TODAY,-14);
  const groups={};
  for(const e of list){
    if(e.start<from) continue;
    const k=`${e.start.getFullYear()}-${String(e.start.getMonth()+1).padStart(2,'0')}`;
    (groups[k]=groups[k]||[]).push(e);
  }
  let html=`<div class="plan"><h2>Season & registration planning</h2>`;
  if(!Object.keys(groups).length) html+=`<p style="color:var(--muted)">Nothing on the horizon matches the current filters.</p>`;
  for(const k of Object.keys(groups).sort()){
    const [y,m]=k.split('-');
    html+=`<div class="pmonth"><h3>${MONTHS[+m-1]} ${y}</h3>`;
    for(const e of groups[k]){
      const dr = sameDay(e.start,e.end) ? `${MONTHS_S[e.start.getMonth()]} ${e.start.getDate()}`
        : `${MONTHS_S[e.start.getMonth()]} ${e.start.getDate()} – ${MONTHS_S[e.end.getMonth()]} ${e.end.getDate()}`;
      let tag='';
      if(e.type==='regcheck') tag=`<span class="tag reg">Reg check</span>`;
      else if(e.type==='potential'){
        const r=(e.reg||'').toLowerCase();
        tag=`<span class="tag ${r==='open'?'open':r==='closed'?'closed':'notyet'}">${esc(e.reg||'Potential')}</span>`;
      }
      else if(e.type==='noschool') tag=`<span class="tag" style="background:#f1f3f4;color:#5f6368;">No school</span>`;
      html+=`<div class="prow" data-ev="${esc(String(e.id))}">
        <div class="date">${dr}</div>
        <div class="pill" style="background:${evColor(e)}"></div>
        <div class="body"><div class="t">${esc(e.title)}</div>
        <div class="sub">${esc([PEOPLE[e.person].name, e.location].filter(Boolean).join(' · '))}</div></div>
        ${tag}</div>`;
    }
    html+=`</div>`;
  }
  // tracking items without parseable dates
  const tbd=siteData.tracking_items.filter(t=>!parseTrackingDates(t));
  if(tbd.length){
    html+=`<div class="pmonth"><h3>Watching — dates TBD</h3>`;
    for(const t of tbd){
      html+=`<div class="prow" data-link="${esc(t.url||'')}">
        <div class="date">${esc(t.dates||'TBD')}</div>
        <div class="pill" style="background:${PEOPLE[t.kid==='T'?'T':t.kid==='E'?'E':t.kid==='S'?'S':'F'].hex}"></div>
        <div class="body"><div class="t">${esc(t.name)}</div><div class="sub">${esc([t.location,t.ages&&('Ages '+t.ages)].filter(Boolean).join(' · '))}</div></div>
        <span class="tag ${String(t.registration).toLowerCase()==='open'?'open':'notyet'}">${esc(t.registration||'TBD')}</span></div>`;
    }
    html+=`</div>`;
  }
  html+=`</div>`;
  content.innerHTML=html;
}

// ----- TRACKING -----
function renderTracking(){
  $('rangeLabel').textContent='Tracking';
  let html=`<div class="plan"><h2>Events being tracked</h2>
    <p style="color:var(--muted);font-size:13px;margin:-6px 0 16px;">Registrations, tryouts and potential events being watched for the kids. Notes are saved in this browser only.</p>`;
  const items=siteData.tracking_items.map((t,i)=>({t,i,d:parseTrackingDates(t)}));
  const dated=items.filter(x=>x.d).sort((a,b)=>a.d[0]-b.d[0]);
  const tbd=items.filter(x=>!x.d);
  const row=x=>{
    const {t,i}=x; const id='track-'+i;
    const kidKey=t.kid==='T'?'T':t.kid==='E'?'E':t.kid==='S'?'S':'F';
    const reg=String(t.registration||'TBD');
    const rl=reg.toLowerCase();
    const cls=rl==='open'?'open':rl==='closed'?'closed':'notyet';
    const note=userNotes[id]||'';
    return `<div class="prow" style="cursor:default;flex-wrap:wrap;">
      <div class="date">${esc(t.dates||'TBD')}</div>
      <div class="pill" style="background:${PEOPLE[kidKey].hex}"></div>
      <div class="body" style="flex:1;">
        <div class="t">${esc(t.name)}</div>
        <div class="sub">${esc([PEOPLE[kidKey].name,t.location,t.ages&&('Ages '+t.ages)].filter(Boolean).join(' · '))}${t.url?` · <a href="${esc(t.url)}" target="_blank" rel="noopener" style="color:var(--T);">event page ↗</a>`:''}</div>
      </div>
      <span class="tag ${cls}">${esc(reg)}</span>
      <div style="flex-basis:100%;display:flex;gap:8px;margin-top:7px;padding-left:114px;">
        <textarea data-note="${id}" rows="1" placeholder="📝 Add a note…" style="flex:1;border:1px solid var(--border);border-radius:6px;padding:6px 9px;font-family:inherit;font-size:12.5px;color:var(--text);background:#fff;resize:vertical;">${esc(note)}</textarea>
        <button class="btn" data-notesave="${id}" style="padding:5px 12px;font-size:12px;align-self:flex-start;">Save</button>
      </div></div>`;
  };
  if(dated.length) html+=`<div class="pmonth"><h3>Upcoming — dated</h3>${dated.map(row).join('')}</div>`;
  if(tbd.length) html+=`<div class="pmonth"><h3>Watching — dates TBD</h3>${tbd.map(row).join('')}</div>`;
  if(!items.length) html+=`<p style="color:var(--muted)">Nothing being tracked right now.</p>`;
  html+=`</div>`;
  content.innerHTML=html;
}

// ----- AGENDA (search) -----
function renderAgenda(){
  $('rangeLabel').textContent=`Search: “${searchQ}”`;
  const list=visible().sort((a,b)=>a.start-b.start);
  let html=`<div class="agenda">`;
  if(!list.length) html+=`<p style="color:var(--muted);margin-top:20px;">No events match.</p>`;
  let lastKey='';
  for(const e of list){
    const k=fmtYMD(e.start);
    if(k!==lastKey){
      lastKey=k;
      html+=`<div class="day-h">${DOW[e.start.getDay()]}, ${MONTHS_S[e.start.getMonth()]} ${e.start.getDate()}, ${e.start.getFullYear()}</div>`;
    }
    html+=`<div class="prow" data-ev="${esc(String(e.id))}">
      <div class="date">${e.allDay?'All day':fmtTime(e.start)}</div>
      <div class="pill" style="background:${evColor(e)}"></div>
      <div class="body"><div class="t">${esc(e.title)}</div><div class="sub">${esc([PEOPLE[e.person].name,e.location].filter(Boolean).join(' · '))}</div></div></div>`;
  }
  html+=`</div>`;
  content.innerHTML=html;
}

// ----- MINI CALENDAR -----
function renderMini(){
  const y=miniCursor.getFullYear(), m=miniCursor.getMonth();
  const first=new Date(y,m,1), gs=startOfWeek(first);
  let html=`<div class="mini-head">
    <span class="m-label">${MONTHS[m]} ${y}</span>
    <span><button id="miniPrev">‹</button><button id="miniNext">›</button></span></div>
    <div class="mini-grid">${DOW.map(d=>`<div class="dn">${d[0]}</div>`).join('')}`;
  for(let i=0;i<42;i++){
    const d=addDays(gs,i);
    if(i>=35&&d.getMonth()!==m) break;
    html+=`<div class="d${d.getMonth()!==m?' other':''}${sameDay(d,TODAY)?' today':''}${sameDay(d,cursor)?' sel':''}" data-goday="${fmtYMD(d)}">${d.getDate()}</div>`;
  }
  html+=`</div>`;
  $('miniCal').innerHTML=html;
  $('miniPrev').onclick=()=>{miniCursor=new Date(y,m-1,1);renderMini();};
  $('miniNext').onclick=()=>{miniCursor=new Date(y,m+1,1);renderMini();};
}

// ----- SIDEBAR FILTERS -----
function renderFilters(){
  const counts={people:{},types:{}};
  for(const e of events){
    counts.people[e.person]=(counts.people[e.person]||0)+1;
    counts.types[e.type]=(counts.types[e.type]||0)+1;
  }
  let ph='<h4>People</h4>';
  for(const [k,p] of Object.entries(PEOPLE)){
    const on=filters.people[k];
    ph+=`<div class="frow${on?' on':''}" data-fp="${k}">
      <span class="cb" style="${on?`background:${p.hex}`:''}">${on?'✓':''}</span>
      <span class="lbl">${p.name}</span><span class="cnt">${counts.people[k]||0}</span></div>`;
  }
  $('peopleFilters').innerHTML=ph;
  let th='<h4>Event types</h4>';
  for(const [k,t] of Object.entries(TYPES)){
    const on=filters.types[k];
    th+=`<div class="frow${on?' on':''}" data-ft="${k}">
      <span class="cb" style="${on?'background:#5f6368':''}">${on?'✓':''}</span>
      <span class="lbl">${t.icon} ${t.label}</span><span class="cnt">${counts.types[k]||0}</span></div>`;
  }
  $('typeFilters').innerHTML=th;
  $('srcList').innerHTML=siteData.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">↗ ${esc(s.label)}</a>`).join('');
}

// ---------- modals ----------
function openOverlay(m){ $('overlay').classList.add('show'); m.classList.add('show'); }
function closeModals(){
  $('overlay').classList.remove('show');
  document.querySelectorAll('.modal').forEach(m=>m.classList.remove('show'));
}
let currentEv=null;
function showEvent(id){
  const e=events.find(x=>String(x.id)===String(id));
  if(!e) return;
  currentEv=e;
  const p=PEOPLE[e.person];
  const dr = e.allDay
    ? (sameDay(e.start,e.end)?fullDate(e.start):`${fullDate(e.start)} – ${fullDate(e.end)}`)
    : `${fullDate(e.start)} · ${fmtTime(e.start)} – ${fmtTime(e.end)}`;
  let html=`<div class="ev-title"><span class="swatch" style="background:${evColor(e)}"></span><span>${esc(e.title)}</span></div>
    <div class="ev-meta">${dr}</div>
    <div class="ev-detail"><span class="ic">👤</span><span><span class="chip-person" style="background:${p.hex}">${p.name}</span>
      &nbsp;<span style="color:var(--muted);font-size:12px;">${TYPES[e.type]?.icon||''} ${TYPES[e.type]?.label||e.type}</span></span></div>`;
  if(e.location) html+=`<div class="ev-detail"><span class="ic">📍</span><a href="https://maps.google.com/?q=${encodeURIComponent(e.location)}" target="_blank" rel="noopener">${esc(e.location)}</a></div>`;
  if(e.link) html+=`<div class="ev-detail"><span class="ic">🔗</span><a href="${esc(e.link)}" target="_blank" rel="noopener">${esc(e.link.length>60?e.link.slice(0,57)+'…':e.link)}</a></div>`;
  if(e.source&&e.source!=='user') html+=`<div class="ev-detail"><span class="ic">📥</span><span style="color:var(--muted)">Source: ${esc(e.source)}</span></div>`;
  if(e.notes) html+=`<div class="ev-notes">${esc(e.notes)}</div>`;
  html+=`<div style="margin-top:14px;">
    <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:5px;">📝 My note</label>
    <textarea id="noteBox" rows="2" placeholder="Add a note (saved in this browser only)" style="width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-family:inherit;font-size:13px;color:var(--text);background:#fff;resize:vertical;">${esc(userNotes[e.id]||'')}</textarea>
    <div style="text-align:right;margin-top:6px;"><button class="btn" id="noteSave" style="padding:6px 14px;font-size:13px;">Save note</button></div>
  </div>`;
  $('evBody').innerHTML=html;
  $('noteSave').onclick=()=>{ saveNote(String(e.id),$('noteBox').value); toast('Note saved (this browser only)'); };
  $('evEdit').style.display = e.source==='user' ? '' : 'none';
  openOverlay($('evModal'));
}
function fullDate(d){return `${DOW[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;}

function openForm(edit){
  editingId = edit ? currentEv.id : null;
  $('formTitle').textContent = edit?'Edit event':'Add event';
  $('fDelete').style.display = edit?'':'none';
  if(edit){
    const u=userEvents.find(x=>String(x.id)===String(currentEv.id));
    $('fTitle').value=u.title; $('fPerson').value=u.person||'F'; $('fType').value=u.type||'family';
    $('fStart').value=u.start; $('fEnd').value=u.end||u.start;
    $('fAllDay').checked=u.allDay!==false;
    $('fTimeStart').value=u.timeStart||'09:00'; $('fTimeEnd').value=u.timeEnd||'10:00';
    $('fLoc').value=u.location||''; $('fLink').value=u.link||''; $('fNotes').value=u.notes||'';
  } else {
    $('fTitle').value=''; $('fPerson').value='F'; $('fType').value='family';
    $('fStart').value=fmtYMD(cursor); $('fEnd').value=fmtYMD(cursor);
    $('fAllDay').checked=true; $('fLoc').value=''; $('fLink').value=''; $('fNotes').value='';
  }
  $('timeRow').style.display=$('fAllDay').checked?'none':'flex';
  closeModals(); openOverlay($('formModal'));
}
function saveForm(){
  const title=$('fTitle').value.trim();
  if(!title){toast('Give the event a title');return;}
  const obj={
    id: editingId || 'u-'+Date.now(),
    title, person:$('fPerson').value, type:$('fType').value,
    start:$('fStart').value, end:$('fEnd').value||$('fStart').value,
    allDay:$('fAllDay').checked,
    timeStart:$('fTimeStart').value, timeEnd:$('fTimeEnd').value,
    location:$('fLoc').value.trim(), link:$('fLink').value.trim(), notes:$('fNotes').value.trim(),
  };
  if(editingId){
    const i=userEvents.findIndex(x=>String(x.id)===String(editingId));
    if(i>=0) userEvents[i]=obj;
  } else userEvents.push(obj);
  localStorage.setItem(USER_KEY,JSON.stringify(userEvents));
  rebuild(); closeModals(); toast('Saved — note: stored in this browser only');
}
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',3200);
}

// ---------- navigation ----------
function nav(dir){
  if(view==='month') cursor=new Date(cursor.getFullYear(),cursor.getMonth()+dir,1);
  else if(view==='week') cursor=addDays(cursor,7*dir);
  else if(view==='day') cursor=addDays(cursor,dir);
  else if(view==='year') cursor=new Date(cursor.getFullYear()+dir,cursor.getMonth(),1);
  miniCursor=new Date(cursor);
  render();
}

// ---------- events wiring ----------
document.addEventListener('click',ev=>{
  const t=ev.target;
  const ns=t.closest('[data-notesave]');
  if(ns){ const id=ns.dataset.notesave; const ta=document.querySelector(`textarea[data-note="${id}"]`); if(ta){ saveNote(id,ta.value); toast('Note saved (this browser only)'); } return; }
  if(t.closest('textarea')) return;
  const evEl=t.closest('[data-ev]');
  if(evEl){ showEvent(evEl.dataset.ev); return; }
  const more=t.closest('.ev-more');
  if(more){ openDayPop(more.dataset.day); return; }
  const god=t.closest('[data-goday]');
  if(god){ cursor=parseYMD(god.dataset.goday); miniCursor=new Date(cursor); if(view==='year'||view==='plan') view='day'; if(t.closest('.mini-grid')){} else view = view==='month'||view==='week'?view:'day'; render(); return; }
  const gom=t.closest('[data-gomonth]');
  if(gom){ const [y,m]=gom.dataset.gomonth.split('-'); cursor=new Date(+y,+m-1,1); view='month'; render(); return; }
  const cell=t.closest('.mon-cell');
  if(cell && !t.closest('.ev-chip')){ cursor=parseYMD(cell.dataset.day); view='day'; miniCursor=new Date(cursor); render(); return; }
  const fp=t.closest('[data-fp]');
  if(fp){ filters.people[fp.dataset.fp]=!filters.people[fp.dataset.fp]; persistFilters(); return; }
  const ft=t.closest('[data-ft]');
  if(ft){ filters.types[ft.dataset.ft]=!filters.types[ft.dataset.ft]; persistFilters(); return; }
  const lk=t.closest('[data-link]');
  if(lk&&lk.dataset.link){ window.open(lk.dataset.link,'_blank'); return; }
  if(t.classList.contains('mclose')||t.id==='overlay'){ closeModals(); return; }
});
function persistFilters(){ localStorage.setItem(FILTER_KEY,JSON.stringify(filters)); renderFilters(); render(); }
function openDayPop(dayStr){
  const d=parseYMD(dayStr);
  const evs=eventsOnDay(visible(),d).sort((a,b)=>(a.allDay?-1:1)-(b.allDay?-1:1)||a.start-b.start);
  let html=`<h3>${DOW[d.getDay()]}, ${MONTHS_S[d.getMonth()]} ${d.getDate()}</h3>`;
  for(const e of evs){
    html+= e.allDay
      ? `<div class="ev-chip" data-ev="${esc(String(e.id))}" style="${chipStyle(e)}">${esc(e.title)}</div>`
      : `<div class="ev-chip timed" data-ev="${esc(String(e.id))}"><span class="bullet" style="background:${evColor(e)}"></span><span class="t">${fmtTime(e.start)}</span><span class="n">${esc(e.title)}</span></div>`;
  }
  $('dayPopBody').innerHTML=html;
  openOverlay($('dayPop'));
}
$('todayBtn').onclick=()=>{cursor=new Date(TODAY);miniCursor=new Date(cursor);render();};
$('prevBtn').onclick=()=>nav(-1);
$('nextBtn').onclick=()=>nav(1);
$('viewSwitch').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  view=b.dataset.v; $('searchBox').value=''; searchQ=''; render();
});
$('burger').onclick=()=>{
  const sb=$('sidebar');
  if(window.innerWidth<=900) sb.classList.toggle('open');
  else sb.classList.toggle('hidden');
};
$('searchBox').addEventListener('input',e=>{ searchQ=e.target.value.trim(); render(); });
$('addBtn').onclick=()=>openForm(false);
$('evEdit').onclick=()=>openForm(true);
$('evHide').onclick=()=>{
  if(!currentEv) return;
  if(currentEv.source==='user'){
    userEvents=userEvents.filter(x=>String(x.id)!==String(currentEv.id));
    localStorage.setItem(USER_KEY,JSON.stringify(userEvents));
  } else {
    hiddenIds.add(currentEv.id);
    localStorage.setItem(HIDDEN_KEY,JSON.stringify([...hiddenIds]));
  }
  rebuild(); closeModals(); toast('Removed (hidden in this browser)');
};
$('fSave').onclick=saveForm;
$('fDelete').onclick=()=>{ $('evHide').onclick(); };
$('fAllDay').onchange=e=>{ $('timeRow').style.display=e.target.checked?'none':'flex'; };
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModals();
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT') return;
  if(e.key==='t') $('todayBtn').onclick();
  if(e.key==='ArrowLeft') nav(-1);
  if(e.key==='ArrowRight') nav(1);
  if(e.key==='m'){view='month';render();}
  if(e.key==='w'){view='week';render();}
  if(e.key==='d'){view='day';render();}
  if(e.key==='y'){view='year';render();}
  if(e.key==='p'){view='plan';render();}
});

// ---------- boot ----------
function rebuild(){
  events=normAll(window._fam||[],window._mass||[],siteData);
  renderFilters(); render();
}
Promise.all([
  fetch('family_cal.json?v='+Date.now()).then(r=>r.ok?r.json():[]).catch(()=>[]),
  fetch('masselite_practices.json?v='+Date.now()).then(r=>r.ok?r.json():[]).catch(()=>[]),
  fetch('site_data.json?v='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null),
]).then(([fam,mass,site])=>{
  window._fam=fam; window._mass=mass;
  if(site) siteData=site;
  rebuild();
});
</script>
