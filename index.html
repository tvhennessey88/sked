<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Hennessey Family Scheduler</title>
<style>
  :root {
    --T:#2563eb; --E:#db2777; --S:#16a34a; --F:#7c3aed;
    --T-bg:#dbeafe; --E-bg:#fce7f3; --S-bg:#dcfce7; --F-bg:#ede9fe;
    --tournament:#fbbf24; --tournament-bg:#fef3c7;
    --game:#10b981; --game-bg:#d1fae5;
    --practice-bg:#f3f4f6; --practice-txt:#6b7280;
    --showcase:#a855f7; --showcase-bg:#f3e8ff;
    --noschool:#94a3b8; --noschool-bg:#f1f5f9;
    --academic:#0ea5e9; --academic-bg:#e0f2fe;
    --family:#8b5cf6; --family-bg:#f5f3ff;
    --bg:#f9fafb; --card:#fff; --border:#e5e7eb; --text:#111827; --muted:#6b7280;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); font-size:14px; }
  header { background:linear-gradient(135deg,#1e40af,#7c3aed); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; opacity:.9; font-size:13px; }
  nav.tabs { background:#fff; border-bottom:1px solid var(--border); display:flex; overflow-x:auto; padding:0 12px; position:sticky; top:0; z-index:10; }
  nav.tabs button { background:none; border:none; padding:12px 14px; font-size:14px; font-weight:500; color:var(--muted); cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap; }
  nav.tabs button.active { color:var(--T); border-bottom-color:var(--T); }
  nav.tabs button:hover { color:var(--text); }
  #filters { background:#fff; padding:10px 14px; border-bottom:1px solid var(--border); display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .chip { padding:5px 10px; border-radius:999px; border:1px solid var(--border); background:#fff; font-size:12px; cursor:pointer; font-weight:500; user-select:none; }
  .chip.active { background:var(--T); color:#fff; border-color:var(--T); }
  .chip.T.active { background:var(--T); border-color:var(--T); }
  .chip.E.active { background:var(--E); border-color:var(--E); }
  .chip.S.active { background:var(--S); border-color:var(--S); }
  .chip.F.active { background:var(--F); border-color:var(--F); }
  .chip.games.active { background:var(--tournament); border-color:var(--tournament); color:#78350f; }
  .chip.practices.active { background:var(--practice-txt); border-color:var(--practice-txt); }
  .divider { width:1px; height:20px; background:var(--border); margin:0 4px; }
  main { padding:14px; max-width:1400px; margin:0 auto; }
  .view { display:none; }
  .view.active { display:block; }
  .nav-bar { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .nav-bar button { padding:6px 12px; border:1px solid var(--border); background:#fff; border-radius:6px; cursor:pointer; font-size:13px; }
  .nav-bar h2 { margin:0; font-size:18px; flex:1; min-width:150px; }

  /* Event pill - shared */
  .evt {
    display:block; padding:4px 6px; border-radius:5px; font-size:11px; line-height:1.3;
    cursor:pointer; margin-bottom:2px; border-left:3px solid transparent;
    text-decoration:none; color:inherit; position:relative;
    word-wrap:break-word; overflow-wrap:break-word; white-space:normal;
  }
  .evt:hover { filter:brightness(0.95); }
  .evt .init { font-weight:700; margin-right:3px; }
  .evt .init.T { color:var(--T); }
  .evt .init.E { color:var(--E); }
  .evt .init.S { color:var(--S); }
  .evt .init.F { color:var(--F); }
  .evt .time { font-size:10px; opacity:.7; margin-right:3px; font-variant-numeric:tabular-nums; }
  .evt.academic { background:var(--academic-bg); border-left-color:var(--academic); }
  .evt.noschool { background:var(--noschool-bg); border-left-color:var(--noschool); font-weight:600; }
  .evt.tournament { background:var(--tournament-bg); border-left-color:var(--tournament); font-weight:600; }
  .evt.showcase { background:var(--showcase-bg); border-left-color:var(--showcase); font-weight:600; }
  .evt.game { background:var(--game-bg); border-left-color:var(--game); }
  .evt.practice { background:var(--practice-bg); border-left-color:#d1d5db; color:var(--practice-txt); font-style:italic; }
  .evt.family { background:var(--family-bg); border-left-color:var(--family); }
  .evt .del { position:absolute; top:1px; right:2px; font-size:10px; padding:0 3px; color:#dc2626; opacity:0; background:rgba(255,255,255,.8); border-radius:3px; }
  .evt:hover .del { opacity:1; }

  /* Monthly grid */
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .cal-head { background:#f3f4f6; padding:8px; text-align:center; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); }
  .cal-cell { background:#fff; min-height:110px; padding:4px; overflow:hidden; }
  .cal-cell.other { background:#fafafa; opacity:.5; }
  .cal-cell.today { background:#fffbeb; }
  .cal-cell .daynum { font-size:11px; font-weight:600; color:var(--muted); margin-bottom:2px; }
  .cal-cell.today .daynum { color:var(--tournament); }

  /* Annual grid */
  .annual-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .mini-month { background:#fff; border:1px solid var(--border); border-radius:8px; padding:10px; }
  .mini-month h3 { margin:0 0 6px; font-size:13px; text-align:center; cursor:pointer; color:var(--T); }
  .mini-month h3:hover { text-decoration:underline; }
  .mini-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; font-size:10px; }
  .mini-grid .mh { text-align:center; color:var(--muted); font-weight:600; padding:2px 0; }
  .mini-day { text-align:center; padding:3px 0; border-radius:3px; position:relative; }
  .mini-day.other { color:#d1d5db; }
  .mini-day.today { background:var(--tournament-bg); font-weight:700; }
  .mini-day .dots { display:flex; justify-content:center; gap:1px; margin-top:1px; height:4px; }
  .mini-day .dot { width:3px; height:3px; border-radius:50%; }
  .mini-day .dot.T { background:var(--T); }
  .mini-day .dot.E { background:var(--E); }
  .mini-day .dot.S { background:var(--S); }
  .mini-day .dot.F { background:var(--F); }
  /* Overview month grid */
  .ov-months { display:flex; flex-direction:column; gap:24px; margin-top:16px; }
  .ov-month { border:1px solid var(--border); border-radius:8px; padding:12px; }
  .ov-month h3 { margin:0 0 10px; }
  .ov-columns { display:grid; grid-template-columns: 1fr 1fr; gap:20px; }
  .ov-left .mini-grid { font-size:12px; gap:2px; }
  .ovcell { padding:4px 2px; text-align:center; border-radius:4px; background:#f8fafc; min-height:32px; position:relative; }
  .ovcell.other { color:#cbd5e1; background:transparent; }
  .ovcell.today { outline:2px solid #0ea5e9; }
  .ovcell.all-off { background:#fef3c7; color:#78350f; font-weight:700; }
  .ovcell.some-off { background:#fef9c3; }
  .ovcell .dots { display:flex; justify-content:center; gap:2px; margin-top:2px; height:5px; }
  .ovcell .dot { width:5px; height:5px; border-radius:50%; }
  .dot.T { background:var(--T); } .dot.E { background:var(--E); } .dot.S { background:var(--S); } .dot.F { background:var(--F); }
  .all-off-list { margin:8px 0 0; font-size:13px; color:#78350f; background:#fef3c7; padding:6px 10px; border-radius:4px; }
  .ov-right h4 { margin:0 0 8px; font-size:14px; color:var(--muted); }
  .tour-item { padding:6px 8px; border-left:3px solid #eab308; background:#fefce8; margin-bottom:4px; font-size:13px; border-radius:0 4px 4px 0; }
  .tour-date { color:var(--muted); font-weight:600; margin-right:6px; }
  .init { display:inline-block; width:16px; height:16px; border-radius:50%; text-align:center; font-size:10px; font-weight:700; color:white; margin-right:4px; line-height:16px; }
  .init.T { background:var(--T); } .init.E { background:var(--E); } .init.S { background:var(--S); } .init.F { background:var(--F); }
  .ov-legend { display:flex; gap:12px; align-items:center; font-size:13px; margin:10px 0; color:var(--muted); flex-wrap:wrap; }
  .lg-swatch { display:inline-block; width:16px; height:16px; border-radius:3px; vertical-align:middle; }
  .lg-swatch.all-off { background:#fef3c7; border:1px solid #fbbf24; }
  .lg-swatch.some-off { background:#fef9c3; }
  .muted-sm { color:var(--muted); font-size:13px; }
  @media (max-width: 720px) { .ov-columns { grid-template-columns: 1fr; } }

  /* Weekly view */
  .week-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .week-day { background:#fff; border:1px solid var(--border); border-radius:8px; padding:8px; min-height:400px; }
  .week-day.today { border-color:var(--tournament); background:#fffbeb; }
  .week-day h4 { margin:0 0 6px; font-size:12px; color:var(--muted); text-align:center; padding-bottom:6px; border-bottom:1px solid var(--border); }
  .week-day .daynum-lg { font-size:20px; color:var(--text); }
  .allday-bubble { background:#e0f2fe; border-radius:6px; padding:3px 6px; margin-bottom:4px; font-size:11px; font-weight:600; border-left:3px solid var(--academic); }

  /* Daily view */
  .day-timeline { background:#fff; border:1px solid var(--border); border-radius:8px; padding:14px; }
  .day-timeline h3 { margin:0 0 10px; }
  .allday-list { display:flex; flex-wrap:wrap; gap:6px; padding:8px 10px; background:#f0f9ff; border-radius:6px; margin-bottom:12px; }
  .allday-list:empty { display:none; }
  .timed-list .timeblock { display:flex; gap:12px; padding:6px 0; border-top:1px solid #f3f4f6; }
  .timed-list .time-label { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; min-width:60px; padding-top:3px; }
  .timed-list .time-events { flex:1; }

  /* Overview */
  .scorecard { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:20px; }
  .stat { background:#fff; padding:12px; border-radius:8px; border:1px solid var(--border); }
  .stat .num { font-size:24px; font-weight:700; color:var(--T); }
  .stat .lbl { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-top:2px; }
  .sources { background:#fff; padding:14px; border-radius:8px; border:1px solid var(--border); margin-bottom:20px; }
  .sources h3 { margin:0 0 10px; font-size:15px; }
  .sources ul { margin:0; padding-left:18px; font-size:13px; }
  .sources li { margin:3px 0; }
  .sources a { color:var(--T); text-decoration:none; }
  .sources a:hover { text-decoration:underline; }
  .overview-table { background:#fff; border-radius:8px; border:1px solid var(--border); overflow:hidden; }
  .overview-row { display:grid; grid-template-columns:120px 1fr 1fr; gap:12px; padding:10px 14px; border-bottom:1px solid #f3f4f6; align-items:start; }
  .overview-row:last-child { border-bottom:0; }
  .overview-date { font-weight:600; color:var(--muted); font-size:12px; }
  .overview-col { display:flex; flex-direction:column; gap:3px; }

  /* Tracking */
  .track-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
  .track-card { background:#fff; border:1px solid var(--border); border-radius:8px; padding:12px; }
  .track-card h4 { margin:0 0 4px; font-size:14px; }
  .track-card .who { display:inline-block; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:700; margin-right:4px; }
  .track-card .who.T { background:var(--T-bg); color:var(--T); }
  .track-card .who.E { background:var(--E-bg); color:var(--E); }
  .track-card p { margin:4px 0; font-size:12px; color:var(--muted); }

  @media (max-width: 720px) {
    main { padding:8px; }
    .cal-cell { min-height:70px; font-size:10px; padding:2px; }
    .cal-cell .daynum { font-size:10px; }
    .annual-grid { grid-template-columns:1fr 1fr; }
    .week-grid { grid-template-columns:1fr; }
    .week-day { min-height:auto; }
    .overview-row { grid-template-columns:1fr; gap:6px; }
    header h1 { font-size:16px; }
    nav.tabs button { padding:10px 10px; font-size:13px; }
    .chip { font-size:11px; padding:4px 8px; }
    .evt { font-size:10px; }
  }
/* WEEKLY/DAILY kid columns */
.week-grid-cols { display:flex; gap:10px; overflow-x:auto; padding-bottom:8px; scroll-snap-type:x mandatory; }
.week-day-cols { background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:10px; min-height:260px; flex:0 0 380px; scroll-snap-align:start; }
.week-day-cols.today { border-color:var(--T); border-width:2px; background:#eff6ff; }
.week-day-cols h4 { margin:0 0 10px; text-align:center; font-size:14px; color:#374151; }
.week-day-cols h4 .daynum-lg { font-size:22px; font-weight:700; color:#111827; margin-left:6px; }
.kid-cols { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.kid-col { min-width:0; }
.kid-col-h { text-align:center; font-size:12px; font-weight:700; padding:3px 0; margin-bottom:6px; }
.kid-col-body { display:flex; flex-direction:column; gap:4px; }
.kid-col-empty { color:#d1d5db; text-align:center; font-size:11px; padding:8px 0; }
.kid-col .evt { font-size:12px; padding:4px 6px; white-space:normal; word-break:break-word; line-height:1.3; }
.kid-col .evt .time { display:block; font-size:10px; opacity:0.75; margin-bottom:1px; }
.day-kid-cols { max-width:1100px; margin:0 auto; }
.day-kid-cols .kid-cols { gap:12px; }
.day-kid-cols .kid-col { background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:10px; min-height:400px; }
.day-kid-cols .kid-col-h { font-size:16px; padding:4px 0 8px; }
.day-kid-cols .evt { font-size:13px; padding:6px 8px; }
@media(max-width:900px){
  .week-grid-cols { grid-template-columns:1fr; }
  .week-day-cols { min-height:auto; }
}
@media(max-width:600px){
  .day-kid-cols .kid-cols { grid-template-columns:1fr; }
}

/* ANNUAL macro cells */
.ann-grid-big { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
.ann-cell { min-height:56px; border:1px solid #f3f4f6; border-radius:5px; padding:3px; background:#fafafa; cursor:pointer; font-size:11px; overflow:hidden; }
.ann-cell:hover { background:#eff6ff; border-color:var(--T); }
.ann-cell.other { color:#d1d5db; background:#fff; }
.ann-cell.today { background:#fef3c7; border-color:#f59e0b; }
.ann-num { font-weight:600; font-size:12px; color:#374151; margin-bottom:2px; }
.ann-cell.other .ann-num { color:#d1d5db; }
.ann-lbl { font-size:10px; padding:1px 3px; border-radius:3px; margin-bottom:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.3; }
.ann-lbl.ann-off { background:#fee2e2; color:#991b1b; font-weight:600; }
.ann-lbl.ann-tour { background:#fef3c7; color:#92400e; font-weight:600; border-left:2px solid #eab308; }

/* Overview edit mode */
.ov-edit-bar { display:flex; align-items:center; gap:12px; margin:0 0 14px; flex-wrap:wrap; }
.ov-edit-btn { background:#fff; border:1px solid #d1d5db; border-radius:6px; padding:6px 12px; font-size:13px; cursor:pointer; font-weight:600; }
.ov-edit-btn.on { background:#dc2626; color:#fff; border-color:#dc2626; }
.ov-edit-btn:hover { background:#f3f4f6; }
.ov-edit-btn.on:hover { background:#b91c1c; }
.ov-edit-hint { color:#6b7280; font-size:12px; font-style:italic; }
.ov-restore-btn { background:#eff6ff; border:1px solid var(--T); color:var(--T); border-radius:6px; padding:6px 12px; font-size:12px; cursor:pointer; }
.ov-del { background:#dc2626; color:#fff; border:none; border-radius:50%; width:16px; height:16px; font-size:10px; line-height:1; cursor:pointer; margin-left:6px; padding:0; vertical-align:middle; }
.ov-del:hover { background:#991b1b; }

/* ANNUAL big view */
.annual-grid-big { display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }
.ann-month { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:12px; }
.ann-month h3 { margin:0 0 10px; font-size:16px; cursor:pointer; color:#1f2937; }
.ann-month h3:hover { color:var(--T); text-decoration:underline; }
.ann-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.ann-mh { font-size:11px; color:#6b7280; text-align:center; font-weight:600; padding:3px 0; }
.ann-day { aspect-ratio:1; min-height:38px; border:1px solid #f3f4f6; border-radius:6px; padding:4px; font-size:12px; cursor:pointer; display:flex; flex-direction:column; justify-content:space-between; background:#fafafa; }
.ann-day:hover { background:#eff6ff; border-color:var(--T); }
.ann-day.other { color:#d1d5db; background:#fff; }
.ann-day.today { background:#fef3c7; border-color:#f59e0b; font-weight:700; }
.ann-dots { display:flex; gap:2px; flex-wrap:wrap; }
.ann-dot { width:6px; height:6px; border-radius:50%; display:inline-block; }
.ann-dot.T { background:var(--T);} .ann-dot.E { background:var(--E);} .ann-dot.S { background:var(--S);} .ann-dot.F { background:var(--F);}
/* Annual full-detail (Google Cal style) */
.annfull-month { background:#fff; border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:18px; }
.annfull-month h3 { margin:0 0 10px; font-size:18px; cursor:pointer; color:#1f2937; }
.annfull-month h3:hover { color:var(--T); text-decoration:underline; }
.annfull-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:#e5e7eb; border:1px solid #e5e7eb; border-radius:6px; overflow:hidden; }
.annfull-head { background:#f9fafb; text-align:center; font-size:11px; color:#6b7280; font-weight:600; padding:6px 0; text-transform:uppercase; letter-spacing:0.5px; }
.annfull-cell { background:#fff; min-height:110px; padding:5px; font-size:11px; cursor:pointer; overflow:hidden; }
.annfull-cell:hover { background:#f8fafc; }
.annfull-cell.other { background:#fafafa; color:#d1d5db; }
.annfull-cell.other .annfull-num { color:#d1d5db; }
.annfull-cell.today { background:#fef3c7; }
.annfull-num { font-weight:600; font-size:12px; color:#374151; margin-bottom:3px; }
.annfull-cell .evt { font-size:10px; padding:1px 4px; margin-bottom:2px; line-height:1.3; }
.annfull-cell .evt .del { display:none; }
.annfull-more { font-size:10px; color:#6b7280; padding:1px 4px; cursor:pointer; }
.annfull-more:hover { color:var(--T); text-decoration:underline; }

/* Add Event modal */
#add-btn { background:var(--T); color:#fff; border:none; border-radius:6px; padding:8px 14px; font-size:14px; font-weight:600; cursor:pointer; }
#add-btn:hover { background:#1d4ed8; }
.modal-back { position:fixed; inset:0; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; z-index:100; }
.modal-back.open { display:flex; }
.modal { background:#fff; border-radius:10px; padding:20px; width:400px; max-width:92vw; max-height:90vh; overflow-y:auto; box-shadow:0 10px 30px rgba(0,0,0,0.3); }
.modal h2 { margin:0 0 14px; font-size:18px; }
.modal label { display:block; margin-bottom:10px; font-size:13px; color:#374151; font-weight:500; }
.modal input, .modal select, .modal textarea { width:100%; box-sizing:border-box; padding:7px 9px; border:1px solid var(--border); border-radius:5px; font-size:14px; font-family:inherit; margin-top:3px; }
.modal .row { display:flex; gap:8px; }
.modal .row label { flex:1; }
.modal .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
.modal button { padding:8px 14px; border-radius:5px; font-size:14px; cursor:pointer; border:1px solid var(--border); background:#fff; }
.modal button.primary { background:var(--T); color:#fff; border-color:var(--T); font-weight:600; }
.modal .allday-row { display:flex; align-items:center; gap:6px; font-size:13px; margin-bottom:10px; }
.modal .allday-row input { width:auto; margin:0; }
@media(max-width:900px){ .annual-grid-big { grid-template-columns:repeat(2,1fr);} }
@media(max-width:600px){ .annual-grid-big { grid-template-columns:1fr;} }

/* OVERVIEW list view */
.ov-month-block { margin:24px 0; }
.ov-month-h { margin:0 0 8px; font-size:20px; color:#111827; border-bottom:2px solid #e5e7eb; padding-bottom:6px; }
.ov-list-header, .ov-list-row {
  display:grid;
  grid-template-columns: 130px 1fr 1fr 1fr 1.5fr;
  gap:10px;
  padding:8px 10px;
  align-items:start;
}
.ov-list-header { font-weight:700; font-size:12px; text-transform:uppercase; color:#6b7280; background:#f9fafb; border-radius:6px; }
.ov-list-row { border-bottom:1px solid #f3f4f6; font-size:13px; }
.ov-list-row.all-off-row { background:#fef3c7; }

<header style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
  <div>
    <h1 style="margin:0">🏠 Hennessey Family Scheduler</h1>
    <p style="margin:4px 0 0">Tommy · Emily · Sophie — annual, monthly, weekly, daily views</p>
  </div>
  <button id="add-btn">＋ Add Event</button>
</header>

<div class="modal-back" id="add-modal">
  <div class="modal">
    <h2>Add Event</h2>
    <label>Title
      <input type="text" id="ae-title" placeholder="e.g. Dentist appointment" />
    </label>
    <div class="row">
      <label>Who
        <select id="ae-kid">
          <option value="T">Tommy</option>
          <option value="E">Emily</option>
          <option value="S">Sophie</option>
          <option value="F" selected>Family</option>
        </select>
      </label>
      <label>Type
        <select id="ae-type">
          <option value="family">Family / Personal</option>
          <option value="practice">Practice</option>
          <option value="game">Game</option>
          <option value="tournament">Tournament</option>
          <option value="academic">Academic</option>
          <option value="noschool">No School / Holiday</option>
        </select>
      </label>
    </div>
    <label>Date
      <input type="date" id="ae-date" />
    </label>
    <div class="allday-row">
      <input type="checkbox" id="ae-allday" />
      <label for="ae-allday" style="margin:0;font-weight:normal">All-day</label>
    </div>
    <div class="row" id="ae-times">
      <label>Start
        <input type="time" id="ae-start" value="09:00" />
      </label>
      <label>End
        <input type="time" id="ae-end" value="10:00" />
      </label>
    </div>
    <label>Location (optional)
      <input type="text" id="ae-loc" />
    </label>
    <label>Link (optional)
      <input type="url" id="ae-link" placeholder="https://..." />
    </label>
    <div class="actions">
      <button id="ae-cancel">Cancel</button>
      <button class="primary" id="ae-save">Save</button>
    </div>
  </div>
</div>

<nav class="tabs">
  <button data-view="monthly" class="active">🗓️ Monthly</button>
  <button data-view="weekly">📅 Weekly</button>
  <button data-view="daily">📍 Daily</button>
  <button data-view="annual">📆 Annual</button>
  <button data-view="overview">📋 Overview</button>
  <button data-view="tracking">📌 Tracking</button>
</nav>

<div id="filters">
  <span class="chip kid T active" data-kid="T">T Tommy</span>
  <span class="chip kid E active" data-kid="E">E Emily</span>
  <span class="chip kid S active" data-kid="S">S Sophie</span>
  <span class="chip kid F active" data-kid="F">F Family</span>
  <span class="divider"></span>
  <span class="chip games active" data-type="games">🏆 Games/Tournaments</span>
  <span class="chip practices active" data-type="practices">🏃 Practices</span>
  <span class="chip academics active" data-type="academics">🏫 Academics</span>
</div>

<main>

  <section class="view active" id="view-monthly"></section>
  <section class="view" id="view-weekly"></section>
  <section class="view" id="view-daily"></section>
  <section class="view" id="view-overview"></section>
  <section class="view" id="view-tracking"></section>
</main>

currentDate.setHours(0,0,0,0);

// ============ FAMILY CAL LOADING + NORMALIZATION ============
let familyEvents = [];

function inferKid(title) {
  const t = title.toLowerCase();
  if (t.includes('tommy')) return 'T';
  if (t.includes('emily')) return 'E';
  if (t.includes('sophie')) return 'S';
  if (t.includes('laura')) return 'F';
  return 'F';
}
function inferType(title) {
  const t = title.toLowerCase();
  if (/tournament|showcase/.test(t)) return 'tournament';
  if (/game|jamboree/.test(t)) return 'game';
  if (/practice|training|s&c/.test(t)) return 'practice';
  return 'family';
}

function normalizeFamilyCal(raw) {
  return raw.map(e => {
    const kid = inferKid(e.title);
    const type = inferType(e.title);
    let start = e.start, end = e.end, allDay = e.allDay;
    return {
      id: 'fc_' + e.id,
      kid: kid,
      type: type,
      title: e.title.replace(/^(Tommy|Emily|Sophie|Laura)[\s\-–—]*/i, ''),
      start: start,
      end: end,
      allDay: allDay,
      location: e.location || '',
      link: e.link,
      source: 'FamilyCal',
    };
  });
}

// Normalize static events
const KID_MAP = { tommy:'T', emily:'E', sophie:'S' };
function classifyStatic(e) {
  const t = e.title;
  const tl = t.toLowerCase();
  if (e.level === 'practice') return 'practice';
  if (e.level === 'operational') {
    if (/game|jamboree/.test(tl)) return 'game';
    return 'tournament';
  }
  // Academic (no level set) — RL/NCDS/Tenacre
  if (/no school|no classes|break|vacation|thanksgiving|holiday|patriots day|mlk|presidents|labor day|off day|pt conferences —|—\s*(pt conferences|report writing|professional)/i.test(t)) return 'noschool';
  return 'academic';
}
// Practice time lookups (recurring practices with known times, added by title pattern)
const PRACTICE_TIMES = [
  // Laxachusetts (Tommy)
  { match: /Skills \(Winchester\)/,          start:'19:30', end:'20:30' },
  { match: /Skills \(Sudbury\)/,             start:'19:30', end:'21:00' },
  { match: /Shooting\/Speed \(Union Pt\)/,   start:'20:00', end:'21:00' },
  { match: /Attack\/Defense \(Union Pt\)/,   start:'19:00', end:'20:00' },
  { match: /Skills \(Norwood\)/,             start:'19:30', end:'21:00' },
  { match: /Skills\+Full-Field \(Union Pt\)/,start:'19:40', end:'21:00' },
  { match: /Shooting \(Sudbury\)/,           start:'20:00', end:'21:00' },
  // Mass Elite (Emily & Sophie) — youth club window
  { match: /ME: Practice \(Union Pt\)/,           start:'18:00', end:'19:30' },
  { match: /ME: Practice \(Forekicks Marlboro\)/, start:'18:00', end:'19:30' },
  // Achievelax indoor
  { match: /Achievelax Indoor/,              start:'17:00', end:'18:00' },
  { match: /Achievelax Summer/,              start:'17:00', end:'18:30' },
  // WPC practice (already in family_cal generally, but for static fallback)
  { match: /WPC: Practice/,                  start:'17:30', end:'19:00' },
];
function lookupPracticeTime(title) {
  for (const p of PRACTICE_TIMES) if (p.match.test(title)) return p;
  return null;
}
function normalizeStatic() {
  return STATIC_EVENTS.map((e,i) => {
    const pt = e.time ? {start:e.time, end:e.endTime||e.time} : lookupPracticeTime(e.title);
    const dateOnly = String(e.start).slice(0,10);
    let start, end, allDay;
    if (pt && !e.end) {
      start = `${dateOnly}T${pt.start}:00`;
      end   = `${dateOnly}T${pt.end}:00`;
      allDay = false;
    } else {
      start = e.start;
      end = e.end ? (new Date(new Date(e.end).getTime() + 86400000)).toISOString().slice(0,10) : e.start;
      allDay = true;
    }
    return {
      id: 'st_' + i,
      kid: KID_MAP[e.kid] || 'F',
      type: classifyStatic(e),
      title: e.title,
      start, end, allDay,
      location: '',
      link: e.url || '',
      source: e.title.split(':')[0].trim(),
    };
  });
}

let scrapedMEEvents = [];
function normalizeMEScraped(raw) {
  return raw.map((e,i) => ({
    id: 'me_' + i,
    kid: e.kid === 'Emily' ? 'E' : (e.kid === 'Sophie' ? 'S' : 'F'),
    type: 'practice',
    title: e.title,
    start: `${e.start}T${e.time_start}:00`,
    end:   `${e.start}T${e.time_end}:00`,
    allDay: false,
    location: e.location || '',
    link: 'https://www.masselite.com/team/schedules/practice-schedule/',
    source: 'Mass Elite',
  }));
}
function allEvents() {
  // Skip legacy static "ME: Practice" entries when scraped data is present (avoid dupes)
  const staticEvts = normalizeStatic().filter(e => !(scrapedMEEvents.length && /ME: Practice/.test(e.title)));
  return [...staticEvts, ...familyEvents, ...scrapedMEEvents, ...userEvents];
}

// ============ HELPERS ============
function fmtTime(iso) {
  if (!iso || iso.length <= 10) return '';
  const d = new Date(iso);
  let h = d.getHours(), m = d.getMinutes();
  const ap = h >= 12 ? 'p' : 'a';
  h = h % 12 || 12;
  return m ? `${h}:${String(m).padStart(2,'0')}${ap}` : `${h}${ap}`;
}
function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function dateKey(d) {
  return d.toISOString().slice(0,10);
}
function eventDates(e) {
  // returns array of YYYY-MM-DD strings this event occupies
  const start = new Date(e.start.slice(0,10));
  const end = e.end ? new Date(e.end.slice(0,10)) : start;
  const dates = [];
  const d = new Date(start);
  while (d < end || d.getTime() === end.getTime()) {
    dates.push(dateKey(d));
    d.setDate(d.getDate()+1);
    if (dates.length > 60) break; // safety
    if (e.allDay && d.getTime() === end.getTime()) break; // exclude exclusive end for allday
  }
  return dates.length ? dates : [dateKey(start)];
}
function passesFilter(e) {
  if (hiddenIds.has(e.id)) return false;
  if (!filters.kids[e.kid]) return false;
  if (e.type === 'tournament' || e.type === 'showcase' || e.type === 'game') return filters.games;
  if (e.type === 'practice') return filters.practices;
  if (e.type === 'academic' || e.type === 'noschool') return filters.academics;
  return true; // family always shown when kid is on
}
function sortDayEvents(events) {
  // Strictly chronological. All-day events treated as 00:00 so they land at top only when they're actually earliest.
  const t = e => {
    if (e.allDay) return '00:00';
    const s = e.start || '';
    const m = s.match(/T(\d{2}:\d{2})/);
    return m ? m[1] : '00:00';
  };
  return events.slice().sort((a,b) => t(a).localeCompare(t(b)));
}
function buildIndex(events) {
  const idx = {};
  events.forEach(e => {
    eventDates(e).forEach(k => {
      (idx[k] = idx[k] || []).push(e);
    });
  });
  return idx;
}

// ============ EVENT PILL RENDER ============
function pillHTML(e, opts={}) {
  const cls = e.type === 'noschool' ? 'noschool' :
              e.type === 'tournament' ? 'tournament' :
              e.type === 'showcase' ? 'showcase' :
              e.type === 'game' ? 'game' :
              e.type === 'practice' ? 'practice' :
              e.type === 'family' ? 'family' :
              e.type === 'academic' ? 'academic' : 'academic';
  const time = !e.allDay ? `<span class="time">${fmtTime(e.start)}</span>` : '';
  const init = `<span class="init ${e.kid}">${e.kid}</span>`;
  const href = e.link ? ` href="${e.link}" target="_blank" rel="noopener"` : '';
  const tag = e.link ? 'a' : 'div';
  return `<${tag} class="evt ${cls}"${href} data-id="${e.id}">${init}${time}${e.title}<span class="del" data-del="${e.id}">✕</span></${tag}>`;
}

// ============ VIEWS ============
function renderMonthly() {
  const y = currentDate.getFullYear(), m = currentDate.getMonth();
  const first = new Date(y,m,1);
  const startDay = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const gridStart = new Date(y,m,1-startDay);
  const todayKey = dateKey(new Date());
  const idx = buildIndex(allEvents().filter(passesFilter));
  const monthName = first.toLocaleString('en-US',{month:'long',year:'numeric'});
  let html = `<div class="nav-bar">
    <button data-nav="prev">‹</button>
    <button data-nav="today">Today</button>
    <button data-nav="next">›</button>
    <h2>${monthName}</h2>
  </div>
  <div class="cal-grid">`;
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => html += `<div class="cal-head">${d}</div>`);
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const k = dateKey(d);
    const inMonth = d.getMonth() === m;
    const isToday = k === todayKey;
    const evts = sortDayEvents(idx[k] || []);
    html += `<div class="cal-cell ${inMonth?'':'other'} ${isToday?'today':''}" data-date="${k}">
      <div class="daynum">${d.getDate()}</div>
      ${evts.map(e => pillHTML(e)).join('')}
    </div>`;
  }
  html += `</div>`;
  document.getElementById('view-monthly').innerHTML = html;
}

function isMacro(e) {
  // Macro = holidays / kids days off / tournaments / showcases
  return e.type === 'noschool' || e.type === 'tournament' || e.type === 'showcase';
}
function renderAnnual() {
  // 12 stacked full-detail monthly grids starting at CURRENT month.
  const today = new Date();
  const startY = today.getFullYear(), startM = today.getMonth();
  const todayKey = dateKey(today);
  const idx = buildIndex(allEvents().filter(passesFilter));
  let html = `<div class="nav-bar"><h2>Next 12 Months</h2><span style="color:var(--muted);font-size:12px;">Full detail — scroll through the year</span></div>`;
  for (let mi = 0; mi < 12; mi++) {
    const d0 = new Date(startY, startM+mi, 1);
    const y = d0.getFullYear(), m = d0.getMonth();
    const startDay = d0.getDay();
    const gridStart = new Date(y,m,1-startDay);
    const monthName = d0.toLocaleString('en-US',{month:'long',year:'numeric'});
    // Determine number of weeks needed (5 or 6)
    const daysInMonth = new Date(y,m+1,0).getDate();
    const weeks = Math.ceil((startDay + daysInMonth) / 7);
    html += `<div class="annfull-month"><h3 data-jump-month="${y}-${String(m+1).padStart(2,'0')}">${monthName}</h3><div class="annfull-grid">`;
    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(x => html += `<div class="annfull-head">${x}</div>`);
    for (let i = 0; i < weeks*7; i++) {
      const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
      const k = dateKey(d);
      const inMonth = d.getMonth() === m;
      const isToday = k === todayKey;
      const evts = sortDayEvents(idx[k] || []);
      const shown = evts.slice(0,4);
      const more = evts.length > 4 ? `<div class="annfull-more" data-jump-day="${k}">${evts.length-4} more</div>` : '';
      html += `<div class="annfull-cell ${inMonth?'':'other'} ${isToday?'today':''}" data-jump-day="${k}">
        <div class="annfull-num">${d.getDate()}</div>
        ${shown.map(e => pillHTML(e,{compact:true})).join('')}
        ${more}
      </div>`;
    }
    html += `</div></div>`;
  }
  document.getElementById('view-annual').innerHTML = html;
}

function dayKidColumns(evts) {
  // Returns HTML for T/E/S columns. F (family) events show in all three.
  const cols = { T:[], E:[], S:[] };
  sortDayEvents(evts).forEach(e => {
    if (e.kid === 'F') { cols.T.push(e); cols.E.push(e); cols.S.push(e); }
    else if (cols[e.kid]) cols[e.kid].push(e);
  });
  const KIDS = [
    { k:'T', name:'Tommy', color:'var(--T)' },
    { k:'E', name:'Emily', color:'var(--E)' },
    { k:'S', name:'Sophie', color:'var(--S)' },
  ];
  return `<div class="kid-cols">` + KIDS.map(({k,name,color}) => {
    const items = cols[k];
    return `<div class="kid-col">
      <div class="kid-col-h" style="color:${color};border-bottom:2px solid ${color}">${name}</div>
      <div class="kid-col-body">
        ${items.length === 0 ? '<div class="kid-col-empty">—</div>' : items.map(e => pillHTML(e, {compact:true})).join('')}
      </div>
    </div>`;
  }).join('') + `</div>`;
}

function renderWeekly() {
  const start = new Date(currentDate); start.setDate(start.getDate() - start.getDay());
  const todayKey = dateKey(new Date());
  const idx = buildIndex(allEvents().filter(passesFilter));
  const end = new Date(start); end.setDate(end.getDate()+6);
  const rangeStr = `${start.toLocaleString('en-US',{month:'short',day:'numeric'})} – ${end.toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric'})}`;
  let html = `<div class="nav-bar">
    <button data-nav="prev">‹</button>
    <button data-nav="today">This week</button>
    <button data-nav="next">›</button>
    <h2>Week of ${rangeStr}</h2>
  </div><div class="week-grid-cols">`;
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(start.getDate()+i);
    const k = dateKey(d);
    const evts = idx[k]||[];
    const dow = d.toLocaleString('en-US',{weekday:'short'});
    html += `<div class="week-day-cols ${k===todayKey?'today':''}">
      <h4 data-jump-day="${k}" style="cursor:pointer">${dow} <span class="daynum-lg">${d.getDate()}</span></h4>
      ${dayKidColumns(evts)}
    </div>`;
  }
  html += `</div>`;
  document.getElementById('view-weekly').innerHTML = html;
}

function renderDaily() {
  const k = dateKey(currentDate);
  const idx = buildIndex(allEvents().filter(passesFilter));
  const evts = idx[k]||[];
  const label = currentDate.toLocaleString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  let html = `<div class="nav-bar">
    <button data-nav="prev">‹</button>
    <button data-nav="today">Today</button>
    <button data-nav="next">›</button>
    <h2>${label}</h2>
  </div>
  <div class="day-kid-cols">${dayKidColumns(evts)}</div>`;
  document.getElementById('view-daily').innerHTML = html;
}

function schoolOf(e) {
  const t = e.title || '';
  if (t.startsWith('RL:') || t.startsWith('RL ')) return 'RL';
  if (t.startsWith('NCDS:') || t.startsWith('NCDS ')) return 'NCDS';
  if (t.startsWith('Tenacre:') || t.startsWith('Tenacre ')) return 'Tenacre';
  if (e.kid === 'T') return 'RL';
  if (e.kid === 'E') return 'NCDS';
  if (e.kid === 'S') return 'Tenacre';
  return '';
}

function renderOverview() {
  const today = new Date();
  const startY = today.getFullYear(), startM = today.getMonth();
  const rangeStart = new Date(startY, startM, 1);
  const rangeEnd = new Date(startY, startM+12, 0);

  const evts = allEvents().filter(e => !hiddenIds.has(e.id));
  // Gather academic (academic + noschool) and tournaments in range
  const byDate = {}; // dateKey -> { acad: [], tour: [] }
  function bucket(k) { return byDate[k] = byDate[k] || { acad: [], tour: [] }; }
  const offByKid = { T:new Set(), E:new Set(), S:new Set() };

  evts.forEach(e => {
    const inRange = (k) => {
      const d = new Date(k);
      return d >= rangeStart && d <= rangeEnd;
    };
    if (e.type === 'academic' || e.type === 'noschool') {
      eventDates(e).forEach(k => {
        if (!inRange(k)) return;
        bucket(k).acad.push(e);
        if (e.type === 'noschool' && offByKid[e.kid]) offByKid[e.kid].add(k);
      });
    } else if (e.type === 'tournament' || e.type === 'showcase' || e.type === 'game') {
      const k = (e.start||'').slice(0,10);
      if (k && inRange(k)) bucket(k).tour.push(e);
    }
  });

  const allDates = Object.keys(byDate).sort();
  const allOffDays = [...offByKid.T].filter(d => offByKid.E.has(d) && offByKid.S.has(d));

  // Group by month for readability
  const byMonth = {};
  allDates.forEach(k => {
    const mk = k.slice(0,7);
    (byMonth[mk] = byMonth[mk] || []).push(k);
  });

  const SCHOOL_META = {
    RL: { name: 'RL', color: 'var(--T)', kid: 'T' },
    NCDS: { name: 'NCDS', color: 'var(--E)', kid: 'E' },
    Tenacre: { name: 'Tenacre', color: 'var(--S)', kid: 'S' },
  };

  function delBtn(e) {
    return overviewEditMode ? `<button class="ov-del" data-del="${escapeHtml(e.id)}" title="Delete from all views">✕</button>` : '';
  }
  function schoolCell(events) {
    if (!events.length) return '<span class="ov-empty">—</span>';
    return events.map(e => {
      const isOff = e.type === 'noschool';
      const link = e.url ? `<a href="${e.url}" target="_blank" rel="noopener">${escapeHtml(cleanTitle(e))}</a>` : escapeHtml(cleanTitle(e));
      return `<div class="ov-acad-item ${isOff?'off':''}">${isOff?'🚫 ':''}${link}${delBtn(e)}</div>`;
    }).join('');
  }

  function cleanTitle(e) {
    return (e.title||'').replace(/^(RL|NCDS|Tenacre):\s*/, '').replace(/^(RL|NCDS|Tenacre)\s+/, '');
  }

  let listHtml = '';
  Object.keys(byMonth).sort().forEach(mk => {
    const [yy, mm] = mk.split('-').map(Number);
    const monthName = new Date(yy, mm-1, 1).toLocaleString('en-US', { month: 'long', year: 'numeric' });
    listHtml += `<div class="ov-month-block"><h3 class="ov-month-h">${monthName}</h3>
      <div class="ov-list-header">
        <div>Date</div>
        <div style="color:var(--T)">RL (Tommy)</div>
        <div style="color:var(--E)">NCDS (Emily)</div>
        <div style="color:var(--S)">Tenacre (Sophie)</div>
        <div>🏆 Tournaments / Showcases</div>
      </div>`;
    byMonth[mk].forEach(k => {
      const row = byDate[k];
      const dObj = new Date(k+'T00:00:00');
      const isAllOff = allOffDays.includes(k);
      const rl = row.acad.filter(e => schoolOf(e)==='RL');
      const nc = row.acad.filter(e => schoolOf(e)==='NCDS');
      const te = row.acad.filter(e => schoolOf(e)==='Tenacre');
      const tour = row.tour;
      const dow = dObj.toLocaleString('en-US',{weekday:'short'});
      const dayStr = `${dow} ${dObj.toLocaleString('en-US',{month:'short',day:'numeric'})}`;
      listHtml += `<div class="ov-list-row ${isAllOff?'all-off-row':''}">
        <div class="ov-date">${dayStr}${isAllOff?' 🎉':''}</div>
        <div class="ov-school">${schoolCell(rl)}</div>
        <div class="ov-school">${schoolCell(nc)}</div>
        <div class="ov-school">${schoolCell(te)}</div>
        <div class="ov-tour">${tour.length ? tour.map(t => `<div class="ov-tour-item"><span class="init ${t.kid}">${t.kid}</span> ${t.url?`<a href="${t.url}" target="_blank" rel="noopener">${escapeHtml(t.title)}</a>`:escapeHtml(t.title)}${delBtn(t)}</div>`).join('') : '<span class="ov-empty">—</span>'}</div>
      </div>`;
    });
    listHtml += `</div>`;
  });

  // Scorecard
  const stats = {
    allOff: allOffDays.length,
    tournaments: Object.values(byDate).reduce((n,r) => n + r.tour.length, 0),
    practices: evts.filter(e => e.type==='practice').length,
    academicDates: allDates.length,
  };

  const bySource = { T:[], E:[], S:[], F:[] };
  SOURCES.forEach(s => { if (bySource[s.kid]) bySource[s.kid].push(s); });
  const srcHtml = ['T','E','S','F'].map(k => {
    const kName = {T:'Tommy',E:'Emily',S:'Sophie',F:'Family'}[k];
    return `<div><strong style="color:var(--${k})">${kName}</strong><ul>${bySource[k].map(s => `<li><a href="${s.url}" target="_blank" rel="noopener">${s.label}</a></li>`).join('')}</ul></div>`;
  }).join('');

  const editBar = `<div class="ov-edit-bar">
    <button id="ov-edit-toggle" class="ov-edit-btn ${overviewEditMode?'on':''}">${overviewEditMode?'✓ Done editing':'✎ Edit (delete events)'}</button>
    ${overviewEditMode?'<span class="ov-edit-hint">Click the ✕ next to any event to remove it from all views.</span>':''}
    ${hiddenIds.size?`<button id="ov-restore" class="ov-restore-btn">Restore ${hiddenIds.size} deleted</button>`:''}
  </div>`;
  document.getElementById('view-overview').innerHTML = `
    ${editBar}
    <div class="scorecard">
      <div class="stat"><div class="num" style="color:#eab308">${stats.allOff}</div><div class="lbl">All-kids-off days</div></div>
      <div class="stat"><div class="num" style="color:var(--tournament)">${stats.tournaments}</div><div class="lbl">Tournaments / Showcases</div></div>
      <div class="stat"><div class="num">${stats.practices}</div><div class="lbl">Practices</div></div>
      <div class="stat"><div class="num">${stats.academicDates}</div><div class="lbl">Academic dates</div></div>
    </div>
    <div class="ov-list">${listHtml || '<p class="muted-sm">No academic or tournament dates in this window.</p>'}</div>
    <div class="sources"><h3>📡 Data Sources</h3><div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px;">${srcHtml}</div></div>
  `;
  return;

}

// ============ RENDER DISPATCH ============
function render() {
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.view === currentView));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-'+currentView));
  if (currentView === 'annual') renderAnnual();
  else if (currentView === 'monthly') renderMonthly();
  else if (currentView === 'weekly') renderWeekly();
  else if (currentView === 'daily') renderDaily();
  else if (currentView === 'overview') renderOverview();
  else if (currentView === 'tracking') renderTracking();
}

// ============ EVENT WIRING ============
document.querySelectorAll('nav.tabs button').forEach(b => {
  b.addEventListener('click', () => { currentView = b.dataset.view; render(); });
});
document.querySelectorAll('#filters .chip.kid').forEach(c => {
  c.addEventListener('click', () => {
    const k = c.dataset.kid;
    filters.kids[k] = !filters.kids[k];
    c.classList.toggle('active', filters.kids[k]);
    localStorage.setItem(FILTER_KEY, JSON.stringify(filters));
    render();
  });
});
document.querySelectorAll('#filters .chip[data-type]').forEach(c => {
  c.addEventListener('click', () => {
    const t = c.dataset.type;
    filters[t] = !filters[t];
    c.classList.toggle('active', filters[t]);
    localStorage.setItem(FILTER_KEY, JSON.stringify(filters));
    render();
  });
});

// Apply saved filter state to UI
function syncFilterUI() {
  document.querySelectorAll('#filters .chip.kid').forEach(c => c.classList.toggle('active', filters.kids[c.dataset.kid]));
  document.querySelectorAll('#filters .chip[data-type]').forEach(c => c.classList.toggle('active', !!filters[c.dataset.type]));
}
syncFilterUI();

// Nav bar (delegate)
document.body.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-nav]');
  if (nav) {
    const action = nav.dataset.nav;
    if (action === 'today') currentDate = new Date();
    else if (action === 'prev') {
      if (currentView === 'monthly') currentDate.setMonth(currentDate.getMonth()-1);
      else if (currentView === 'weekly') currentDate.setDate(currentDate.getDate()-7);
      else if (currentView === 'daily') currentDate.setDate(currentDate.getDate()-1);
      else if (currentView === 'annual') currentDate.setFullYear(currentDate.getFullYear()-1);
    } else if (action === 'next') {
      if (currentView === 'monthly') currentDate.setMonth(currentDate.getMonth()+1);
      else if (currentView === 'weekly') currentDate.setDate(currentDate.getDate()+7);
      else if (currentView === 'daily') currentDate.setDate(currentDate.getDate()+1);
      else if (currentView === 'annual') currentDate.setFullYear(currentDate.getFullYear()+1);
    }
    currentDate.setHours(0,0,0,0);
    render();
    return;
  }
  // Annual: click a day → jump to Daily view
  const jumpDay = e.target.closest('[data-jump-day]');
  if (jumpDay) {
    const k = jumpDay.dataset.jumpDay;
    currentDate = new Date(k+'T00:00:00');
    currentView = 'daily';
    render();
    return;
  }
  // Annual: click month name → jump to Monthly
  const jumpMonth = e.target.closest('[data-jump-month]');
  if (jumpMonth) {
    const [y,m] = jumpMonth.dataset.jumpMonth.split('-').map(Number);
    currentDate = new Date(y, m-1, 1);
    currentView = 'monthly';
    render();
    return;
  }
  // Overview: toggle edit mode
  if (e.target.closest('#ov-edit-toggle')) {
    overviewEditMode = !overviewEditMode;
    render();
    return;
  }
  // Overview: restore all deleted
  if (e.target.closest('#ov-restore')) {
    if (confirm(`Restore ${hiddenIds.size} deleted events?`)) {
      hiddenIds.clear();
      localStorage.setItem(HIDDEN_KEY, JSON.stringify([]));
      render();
    }
    return;
  }
  // Delete X on events
  const del = e.target.closest('[data-del]');
  if (del) {
    e.preventDefault(); e.stopPropagation();
    hiddenIds.add(del.dataset.del);
    localStorage.setItem(HIDDEN_KEY, JSON.stringify([...hiddenIds]));
    render();
    return;
  }
});

// ============ ADD EVENT MODAL ============
function openAddModal(prefillDate) {
  const modal = document.getElementById('add-modal');
  document.getElementById('ae-title').value = '';
  document.getElementById('ae-kid').value = 'F';
  document.getElementById('ae-type').value = 'family';
  document.getElementById('ae-date').value = prefillDate || dateKey(new Date());
  document.getElementById('ae-allday').checked = false;
  document.getElementById('ae-start').value = '09:00';
  document.getElementById('ae-end').value = '10:00';
  document.getElementById('ae-loc').value = '';
  document.getElementById('ae-link').value = '';
  document.getElementById('ae-times').style.display = 'flex';
  modal.classList.add('open');
  setTimeout(() => document.getElementById('ae-title').focus(), 50);
}
function closeAddModal() { document.getElementById('add-modal').classList.remove('open'); }
document.getElementById('add-btn').addEventListener('click', () => openAddModal());
document.getElementById('ae-cancel').addEventListener('click', closeAddModal);
document.getElementById('add-modal').addEventListener('click', (e) => {
  if (e.target.id === 'add-modal') closeAddModal();
});
document.getElementById('ae-allday').addEventListener('change', (e) => {
  document.getElementById('ae-times').style.display = e.target.checked ? 'none' : 'flex';
});
document.getElementById('ae-save').addEventListener('click', () => {
  const title = document.getElementById('ae-title').value.trim();
  if (!title) { alert('Title is required'); return; }
  const date = document.getElementById('ae-date').value;
  if (!date) { alert('Date is required'); return; }
  const kid = document.getElementById('ae-kid').value;
  const type = document.getElementById('ae-type').value;
  const allday = document.getElementById('ae-allday').checked;
  const st = document.getElementById('ae-start').value;
  const en = document.getElementById('ae-end').value;
  const loc = document.getElementById('ae-loc').value.trim();
  const link = document.getElementById('ae-link').value.trim();
  const evt = {
    id: 'user_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    kid, type, title,
    start: allday ? date : `${date}T${st}:00`,
    end:   allday ? date : `${date}T${en}:00`,
    allDay: allday,
    location: loc,
    link: link || undefined,
    source: 'User',
    level: 'operational',
  };
  userEvents.push(evt);
  saveUserEvents();
  closeAddModal();
  render();
});

// ============ INIT: load family_cal.json then render ============
Promise.all([
  fetch('family_cal.json').then(r => r.ok ? r.json() : []).catch(()=>[]),
  fetch('masselite_practices.json').then(r => r.ok ? r.json() : []).catch(()=>[]),
]).then(([fam, me]) => {
  familyEvents = normalizeFamilyCal(fam);
  scrapedMEEvents = normalizeMEScraped(me);
  render();
});

// initial render immediately (before family cal loads)
render();
