<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hennessey Family Scheduler</title>
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
a{color:inherit}

/* HEADER */
.header{background:#1e293b;border-bottom:1px solid #334155;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header h1{font-size:16px;font-weight:700;color:#f1f5f9}
.header .today{font-size:11px;color:#94a3b8;margin-left:10px}

/* TOOLBAR */
.view-toolbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 0;flex-wrap:wrap;gap:8px}
.view-toggle{display:flex;gap:5px;flex-wrap:wrap}
.view-btn{padding:6px 14px;border-radius:8px;border:1.5px solid #334155;cursor:pointer;font-size:12px;font-weight:700;background:transparent;color:#64748b;transition:all .15s}
.view-btn:hover{border-color:#64748b;color:#cbd5e1}
.view-btn.active{background:#1e293b;border-color:#475569;color:#f1f5f9}
.edit-btn{padding:5px 12px;border-radius:8px;border:1.5px solid #334155;cursor:pointer;font-size:11px;font-weight:700;background:transparent;color:#94a3b8}
.edit-btn:hover{border-color:#ef4444;color:#fca5a5}
.edit-btn.active{background:rgba(239,68,68,.15);border-color:#ef4444;color:#fca5a5}
.restore-btn{padding:5px 10px;border-radius:8px;border:1.5px solid #334155;cursor:pointer;font-size:11px;font-weight:700;background:transparent;color:#64748b;margin-left:5px}

/* UNIVERSAL FILTER BAR */
.filter-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 20px 0}
.fb-btn{padding:5px 13px;border-radius:20px;border:1.5px solid #334155;cursor:pointer;font-size:11px;font-weight:600;background:transparent;color:#64748b}
.fb-btn:hover{border-color:#64748b;color:#cbd5e1}
.fb-btn.active{background:#1e293b;border-color:#475569;color:#f1f5f9}
.fb-btn.tommy.active{background:rgba(59,130,246,.2);border-color:#3b82f6;color:#93c5fd}
.fb-btn.emily.active{background:rgba(236,72,153,.2);border-color:#ec4899;color:#f9a8d4}
.fb-btn.sophie.active{background:rgba(16,185,129,.2);border-color:#10b981;color:#6ee7b7}
.fb-btn.sports.active{background:rgba(251,191,36,.15);border-color:#fbbf24;color:#fbbf24}
.fb-btn.practice.active{background:rgba(148,163,184,.15);border-color:#94a3b8;color:#94a3b8}
.fb-sep{width:1px;height:18px;background:#334155;margin:0 4px}

/* CALENDAR CONTAINER */
.cal-wrap{margin:14px 20px 30px;background:#1e293b;border-radius:12px;border:1px solid #334155;padding:18px}
.fc{--fc-border-color:#334155;--fc-today-bg-color:rgba(59,130,246,.08);--fc-page-bg-color:transparent}
.fc .fc-col-header-cell-cushion{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;text-decoration:none}
.fc .fc-daygrid-day-number{font-size:11px;color:#94a3b8;text-decoration:none}
.fc .fc-toolbar-title{font-size:15px !important;font-weight:700;color:#f1f5f9}
.fc .fc-button{background:#334155 !important;border-color:#334155 !important;color:#e2e8f0 !important;font-size:11px !important;border-radius:6px !important;padding:4px 10px !important}
.fc .fc-button:hover{background:#475569 !important}
.fc .fc-button-active{background:#3b82f6 !important;border-color:#3b82f6 !important}
.fc .fc-multimonth{border:none !important}
.fc .fc-multimonth-title{color:#f1f5f9 !important;font-size:13px !important;font-weight:800 !important;padding:8px 0 !important}

/* EVENTS — HYBRID COLOR: initial colored by kid, bg by event type */
.fc-event{border-radius:5px !important;border:none !important;font-size:10px !important;padding:2px 5px !important;cursor:pointer !important;line-height:1.3 !important}
.evt{display:inline-flex;align-items:center;gap:4px}
.evt .ini{font-weight:900;font-size:11px;padding:0 4px;border-radius:3px;background:rgba(0,0,0,.25)}
.evt .ini.T{color:#93c5fd}
.evt .ini.E{color:#f9a8d4}
.evt .ini.S{color:#6ee7b7}
.evt .txt{font-weight:600}

/* type backgrounds — same class used both in FC events and Overview pills */
.type-academic{background:rgba(96,165,250,.14) !important;color:#dbeafe !important}
.type-academic.k-emily{background:rgba(244,114,182,.14) !important;color:#fce7f3 !important}
.type-academic.k-sophie{background:rgba(52,211,153,.14) !important;color:#d1fae5 !important}
.type-noschool{background:rgba(71,85,105,.35) !important;color:#cbd5e1 !important}
.type-tournament{background:rgba(251,191,36,.22) !important;color:#fde68a !important;border-left:3px solid #fbbf24 !important}
.type-game{background:rgba(16,185,129,.22) !important;color:#a7f3d0 !important;border-left:3px solid #10b981 !important}
.type-practice{background:rgba(148,163,184,.14) !important;color:#cbd5e1 !important;font-style:italic}

body.edit-mode .fc-event:hover{outline:2px solid #ef4444 !important;opacity:.7}
body.edit-mode .fc-event{cursor:crosshair !important}

/* OVERVIEW */
#overview-view{padding:14px 20px 30px}
.ov-top{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.ov-card{background:#1e293b;border-radius:12px;border:1px solid #334155;padding:14px}
.ov-card h3{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:#64748b;margin-bottom:10px}
.ov-kid{margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #334155}
.ov-kid:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.ov-kid-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:#f1f5f9;margin-bottom:6px}
.ov-kid-h .dot{width:10px;height:10px;border-radius:50%}
.ov-kid-src{font-size:11px;color:#94a3b8;margin-left:18px;line-height:1.7}
.ov-kid-src a{color:#60a5fa;text-decoration:none}
.ov-kid-src a:hover{text-decoration:underline}
.ov-month{margin-bottom:24px}
.ov-month-h{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#94a3b8;padding-bottom:8px;border-bottom:1px solid #334155;margin-bottom:8px;display:flex;justify-content:space-between}
.ov-row{display:grid;grid-template-columns:60px 1fr 1fr;gap:12px;padding:5px 8px;border-radius:6px;align-items:baseline}
.ov-row:hover{background:#1e293b}
.ov-date{font-size:11px;font-weight:700;color:#64748b;white-space:nowrap}
.ov-col{display:flex;flex-wrap:wrap;gap:4px}
.ov-col.right{border-left:2px solid #334155;padding-left:10px}
.ov-pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;text-decoration:none;line-height:1.4}
.ov-pill:hover{filter:brightness(1.15)}
.ov-pill .del-x{cursor:pointer;font-size:12px;opacity:.6;margin-left:3px}
.ov-pill .del-x:hover{opacity:1;color:#ef4444}
body:not(.edit-mode) .ov-pill .del-x{display:none}
.all-out-banner{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);border-radius:8px;padding:8px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.ao-label{font-size:12px;font-weight:800;color:#fbbf24}
.ao-range{font-size:10px;color:#78716c}

/* TRACKING */
#tracking-view{padding:16px 20px 30px}
.tracking-intro{font-size:11px;color:#64748b;background:#1e293b;border:1px dashed #334155;border-radius:8px;padding:10px 14px;margin-bottom:20px;line-height:1.6}
.tr-kid-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;border-bottom:1px solid #334155;padding-bottom:8px;font-size:14px;font-weight:800;color:#f1f5f9}
.tr-row{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:8px}
.tr-name{font-size:13px;font-weight:700;color:#e2e8f0;margin-bottom:3px}
.tr-dates{font-size:11px;color:#94a3b8;margin-bottom:3px}
.tr-note{font-size:11px;color:#64748b}
.tr-right{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.tr-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px;text-transform:uppercase;letter-spacing:.5px}
.tr-badge.active{background:rgba(16,185,129,.2);color:#34d399;border:1px solid rgba(16,185,129,.3)}
.tr-badge.upcoming{background:rgba(59,130,246,.15);color:#60a5fa}
.tr-badge.watch{background:rgba(251,191,36,.12);color:#fbbf24}
.tr-badge.past{background:rgba(71,85,105,.2);color:#64748b}
.tr-link{font-size:11px;color:#60a5fa;text-decoration:none}
.tr-link:hover{text-decoration:underline}

/* SCORECARD */
.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.score-cell{padding:10px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid #334155}
.score-cell h4{font-size:12px;font-weight:800;color:#f1f5f9;margin-bottom:4px}
.score-cell .n{font-size:22px;font-weight:900;line-height:1}
.score-cell .n.t{color:#93c5fd}
.score-cell .n.e{color:#f9a8d4}
.score-cell .n.s{color:#6ee7b7}
.score-cell .sub{font-size:10px;color:#94a3b8;margin-top:3px}

.color-legend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px;font-size:11px;color:#94a3b8}
.color-legend .swatch{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
</style>
</head>

// ─── HELPERS ────────────────────────────────
function initial(kid){ return kid==='tommy'?'T':kid==='emily'?'E':kid==='sophie'?'S':'·'; }

function eventType(e){
  if(e.level==='operational') return /Practice/i.test(e.title) ? 'practice' : (/Game/i.test(e.title) ? 'game' : 'tournament');
  if(e.level==='practice') return 'practice';
  if(e.level==='daily') return 'daily';
  if(e.color===X) return 'noschool';
  return 'academic';
}

function sourceUrl(e){
  const t=e.title;
  if(t.startsWith('RL:')) return 'https://roxburylatin.myschoolapp.com/app/parent?svcid=edu#calendar';
  if(t.startsWith('NCDS:')) return 'https://www.newtoncountryday.org/about/calendar/key-dates-and-faqs';
  if(t.startsWith('Tenacre:')) return 'https://www.tenacreschool.org/parents-current-families/school-calendar';
  if(/Achievelax/i.test(t)) return 'https://www.achievelax.com/leagues-4/fall-and-winter-indoor-leagues/';
  if(/ME: Practice/i.test(t)) return 'https://www.masselite.com/team/schedules/practice-schedule/';
  if(/ME:/.test(t)) return 'https://www.masselite.com/team/schedules/tournament-schedule/';
  if(/WPC/i.test(t)) return 'https://go.teamsnap.com/';
  if(/LX:|Laxachusetts|Jr Minutemen|MinuteMen/i.test(t)) return 'https://www.jrminutemenlax.net/page/show/4976531-2025-2026-winter-skills-training-calendar-';
  return null;
}

function displayTitle(e){
  if(/^[TES] — /.test(e.title)) return e.title;
  const ini = initial(e.kid);
  if(!ini || ini==='·') return e.title;
  return ini + ' — ' + e.title;
}

function eventKey(e){ return e.title + '|' + e.start; }

// ─── STATE ──────────────────────────────────
let hiddenKeys = new Set(JSON.parse(localStorage.getItem('sked_hidden')||'[]'));
let editMode = false;
let activeKid = 'all';
let showSports = false;
let showPractice = false;
let currentView = 'monthly';

// ─── HIDE/RESTORE ───────────────────────────
function saveHidden(){ localStorage.setItem('sked_hidden', JSON.stringify([...hiddenKeys])); updateRestoreBtn(); }
function updateRestoreBtn(){
  const n=hiddenKeys.size;
  document.getElementById('hidden-count').textContent=n;
  document.getElementById('restore-btn').style.display = n>0 ? '' : 'none';
}
document.getElementById('restore-btn').onclick = ()=>{ hiddenKeys.clear(); saveHidden(); refreshAll(); };

function toggleEdit(){
  editMode = !editMode;
  document.body.classList.toggle('edit-mode', editMode);
  document.getElementById('edit-toggle-btn').classList.toggle('active', editMode);
  document.getElementById('edit-toggle-btn').textContent = editMode ? '✏️ Editing' : '✏️ Edit';
}
document.getElementById('edit-toggle-btn').onclick = toggleEdit;

// ─── FILTERING ──────────────────────────────
function passesFilter(e){
  if(hiddenKeys.has(eventKey(e))) return false;
  if(activeKid !== 'all' && e.kid !== activeKid) return false;
  const t = eventType(e);
  if(t==='daily') return false;
  if(t==='tournament' || t==='game') return showSports;
  if(t==='practice') return showPractice;
  return true; // academic + noschool always shown
}

function passesOverview(e){
  if(hiddenKeys.has(eventKey(e))) return false;
  if(activeKid !== 'all' && e.kid !== activeKid) return false;
  const t = eventType(e);
  // Overview is strategic: only academic + noschool, or tournaments if sports toggled
  if(t==='academic' || t==='noschool') return true;
  if((t==='tournament' || /Showcase|Tournament/i.test(e.title)) && showSports) return true;
  return false;
}

// ─── FC EVENT BUILDER ───────────────────────
function toFcEvent(e){
  const type = eventType(e);
  const ini = initial(e.kid);
  return {
    title: displayTitle(e),
    start: e.start,
    end: e.end,
    allDay: true,
    url: sourceUrl(e) || undefined,
    classNames: ['type-' + type, 'k-' + (e.kid || 'x')],
    extendedProps: { raw: e, type, ini }
  };
}

// ─── CALENDARS ──────────────────────────────
let calAnnual, calMonthly, calWeekly, calDaily;

function commonCalOpts(view){
  return {
    initialView: view,
    height: 'auto',
    firstDay: 0,
    eventClick: function(info){
      if(editMode){
        info.jsEvent.preventDefault();
        hiddenKeys.add(eventKey(info.event.extendedProps.raw));
        saveHidden();
        refreshAll();
        return;
      }
      if(!info.event.url){ info.jsEvent.preventDefault(); }
    },
    eventContent: function(arg){
      const ini = arg.event.extendedProps.ini;
      const title = arg.event.title.replace(/^[TES] — /,'');
      return { html: `<div class="evt"><span class="ini ${ini}">${ini}</span><span class="txt">${title}</span></div>` };
    },
    events: []
  };
}

function loadEvents(cal){
  cal.removeAllEvents();
  ALL_EVENTS.filter(passesFilter).forEach(e => cal.addEvent(toFcEvent(e)));
}

function initCals(){
  const a = document.getElementById('cal-annual');
  calAnnual = new FullCalendar.Calendar(a, {
    ...commonCalOpts('multiMonthYear'),
    initialDate: '2026-09-01',
    multiMonthMaxColumns: 3,
    headerToolbar: { left:'prev,next today', center:'title', right:'' }
  });

  calMonthly = new FullCalendar.Calendar(document.getElementById('cal-monthly'), {
    ...commonCalOpts('dayGridMonth'),
    initialDate: getInitialDate(),
    headerToolbar: { left:'prev,next today', center:'title', right:'dayGridMonth' },
    dayMaxEventRows: 6
  });

  calWeekly = new FullCalendar.Calendar(document.getElementById('cal-weekly'), {
    ...commonCalOpts('dayGridWeek'),
    initialDate: getInitialDate(),
    headerToolbar: { left:'prev,next today', center:'title', right:'' }
  });

  calDaily = new FullCalendar.Calendar(document.getElementById('cal-daily'), {
    ...commonCalOpts('dayGridDay'),
    initialDate: getInitialDate(),
    headerToolbar: { left:'prev,next today', center:'title', right:'' }
  });
}

function getInitialDate(){
  const now = new Date();
  // Anchor to schedule range
  if(now < new Date('2026-08-01')) return '2026-09-01';
  if(now > new Date('2027-06-30')) return '2027-05-01';
  return now.toISOString().slice(0,10);
}

function renderCurrentCal(){
  if(currentView==='annual'){ loadEvents(calAnnual); calAnnual.render(); }
  if(currentView==='monthly'){ loadEvents(calMonthly); calMonthly.render(); }
  if(currentView==='weekly'){ loadEvents(calWeekly); calWeekly.render(); }
  if(currentView==='daily'){ loadEvents(calDaily); calDaily.render(); }
}

}

// ─── VIEW SWITCH ────────────────────────────
function switchView(v){
  currentView = v;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  ['annual','monthly','weekly','daily','overview','tracking'].forEach(name => {
    document.getElementById(name + '-view').style.display = (name === v ? '' : 'none');
  });
  // Filter bar shown for all except tracking
  document.getElementById('filter-bar').style.display = v==='tracking' ? 'none' : '';
  if(v==='overview') renderOverview();
  else if(v==='tracking') renderTracking();
  else renderCurrentCal();
}

document.querySelectorAll('.view-btn').forEach(b => b.onclick = ()=>switchView(b.dataset.view));

// Kid filter
document.querySelectorAll('.fb-btn[data-kid]').forEach(b => b.onclick = ()=>{
  activeKid = b.dataset.kid;
  document.querySelectorAll('.fb-btn[data-kid]').forEach(x => x.classList.toggle('active', x.dataset.kid === activeKid));
  refreshAll();
});

// Sports/practice toggles
document.getElementById('sports-toggle').onclick = ()=>{
  showSports = !showSports;
  document.getElementById('sports-toggle').classList.toggle('active', showSports);
  refreshAll();
};
document.getElementById('practice-toggle').onclick = ()=>{
  showPractice = !showPractice;
  document.getElementById('practice-toggle').classList.toggle('active', showPractice);
  refreshAll();
};

function refreshAll(){
  if(currentView==='overview') renderOverview();
  else if(currentView==='tracking') renderTracking();
  else renderCurrentCal();
}

// ─── INIT ───────────────────────────────────
document.getElementById('today-label').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
updateRestoreBtn();

document.addEventListener('DOMContentLoaded', ()=>{
  initCals();
  switchView('monthly');
});
</script>
</body>
</html>
